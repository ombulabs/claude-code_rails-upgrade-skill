# Fixture expectations for rails-52-patterns.yml.
#
# Keyed by variable_name. `match` lines the pattern MUST flag, `no_match`
# lines it MUST NOT flag (a per-line grep + grep -v).
#
# Run with:
#   bin/test-patterns rails-upgrade/detection-scripts/patterns/rails-52-patterns.yml

DYNAMIC_ROUTE_SEGMENTS:
  # A :controller or :action segment inside a quoted route path. Hash keys
  # (controller: 'x', :action => 'y') are options, not segments.
  match:
    - "  get ':controller(/:action(/:id))'"
    - "  match 'admin/:controller/:action', via: :get"
    - "  get 'reports/:action', controller: 'reports'"
    - "  get \"/:controller/:id\""
  no_match:
    - "  get 'posts', controller: 'posts', action: :index"
    - "  match 'posts' => 'posts#index', :controller => 'posts', :action => 'index'"
    - "  get 'steps/:action_name', to: 'wizard#show'"
    - "  get ':controller_id/show', to: 'a#b'"

CLASS_NAME_CONSTANT:
  # A constant passed to class_name raises ArgumentError in 5.2. A string,
  # or Foo.name / Foo.to_s, is fine.
  match:
    - "  belongs_to :owner, class_name: User"
    - "  has_many :items, class_name: Billing::Item, foreign_key: :order_id"
    - "  has_many :items, :class_name => Item"
  no_match:
    - "  belongs_to :owner, class_name: 'User'"
    - "  belongs_to :owner, class_name: \"User\""
    - "  belongs_to :owner, class_name: User.name"
    - "  has_many :items, class_name: Billing::Item.to_s"
    - "  has_many :items, :class_name => 'Item'"

ERROR_ON_IGNORED_ORDER_OR_LIMIT:
  match:
    - "  config.active_record.error_on_ignored_order_or_limit = true"
  no_match:
    - "  config.active_record.error_on_ignored_order = true"

HALT_CALLBACK_CHAINS_ON_RETURN_FALSE:
  match:
    - "ActiveSupport.halt_callback_chains_on_return_false = false"
    - "  config.active_support.halt_callback_chains_on_return_false = false"
  no_match:
    - "  throw :abort"
