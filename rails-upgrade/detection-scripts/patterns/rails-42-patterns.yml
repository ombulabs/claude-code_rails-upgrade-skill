version: "4.2"
description: "Breaking change patterns for Rails 4.1 → 4.2 upgrade"

upgrade_findings:
  high_priority:
    - name: "ActionMailer .deliver / .deliver! deprecated"
      kind: "deprecation"
      pattern: "\\.deliver!?\\s*(#|$)"
      exclude: ""
      search_paths:
        - "app/"
        - "lib/"
      explanation: "Rails 4.2 deprecates .deliver and .deliver! in favor of .deliver_now / .deliver_now! (sync) and .deliver_later (async via ActiveJob)"
      fix: "Replace .deliver with .deliver_now, and .deliver! with .deliver_now! (bang-preserving). Use .deliver_later for async delivery via ActiveJob"
      variable_name: "MAILER_DELIVER"

    - name: "respond_with usage"
      kind: "breaking"
      pattern: "\\brespond_with\\b"
      exclude: ""
      search_paths:
        - "app/controllers/"
      explanation: "respond_with and class-level respond_to were extracted from Rails core into the responders gem in Rails 4.2"
      fix: "Add gem 'responders', '~> 2.0' to your Gemfile. No code changes needed."
      variable_name: "RESPOND_WITH"

    - name: "Class-level respond_to declaration"
      kind: "breaking"
      pattern: "^\\s*respond_to\\s+:"
      exclude: ""
      search_paths:
        - "app/controllers/"
      explanation: "Class-level respond_to was extracted to the responders gem. Action-level respond_to do |format| blocks are unaffected"
      fix: "Add gem 'responders', '~> 2.0' to your Gemfile"
      variable_name: "CLASS_RESPOND_TO"

    - name: "Verify raise_in_transactional_callbacks is configured"
      kind: "deprecation"
      pattern: "class\\s+\\w+\\s*<\\s*Rails::Application"
      exclude: ""
      search_paths:
        - "config/application.rb"
      explanation: "FILE MARKER (manual review required): Rails 4.2 still suppresses exceptions in after_commit/after_rollback callbacks but emits a deprecation warning. The application file should opt-in to raising (the Rails 5.0+ default). Grep cannot detect absence of a setting, so this pattern flags config/application.rb itself — open it and verify the setting is present"
      fix: "If config.active_record.raise_in_transactional_callbacks is NOT present in config/application.rb, add: config.active_record.raise_in_transactional_callbacks = true. If it is already set to true, no action needed"
      variable_name: "TRANSACTIONAL_CALLBACKS"

    - name: "RSpec 2.x in Gemfile"
      kind: "breaking"
      pattern: "rspec-rails.*['\"\\(][~><=\\s]*2\\."
      exclude: ""
      search_paths:
        - "Gemfile"
        - "Gemfile.lock"
      explanation: "Rails 4.2 does not support RSpec 2. You must upgrade to RSpec 3 (use 2.99 as an intermediate step to surface deprecations). Matches ~>, >=, >, <=, bare versions, and locked (2.x.y) versions"
      fix: "Upgrade to rspec-rails 2.99 first, fix deprecations, then upgrade to rspec-rails 3.x. Consider Transpec for automation"
      variable_name: "RSPEC_2"

    - name: "assert_tag / TagAssertions"
      kind: "deprecation"
      pattern: "\\bassert_tag\\b"
      exclude: ""
      search_paths:
        - "test/"
        - "spec/"
      explanation: "assert_tag and the TagAssertions module are deprecated in Rails 4.2. Use assert_select from SelectorAssertions (now in the rails-dom-testing gem)"
      fix: "Replace assert_tag with assert_select equivalents"
      variable_name: "ASSERT_TAG"

    - name: "ActiveJob usage requires queue adapter"
      kind: "migration"
      pattern: "\\.deliver_later\\b|<\\s*ActiveJob::Base\\b"
      exclude: ""
      search_paths:
        - "app/"
        - "lib/"
      explanation: "Rails 4.2 introduces ActiveJob. Any use of deliver_later or a class inheriting from ActiveJob::Base requires a configured queue adapter. The default in 4.2 is :inline (runs jobs synchronously in-process), which is rarely what production wants"
      fix: "Set config.active_job.queue_adapter = :sidekiq (or :resque, :delayed_job, :que, etc.) in config/application.rb or per-environment, and ensure the adapter gem is in the Gemfile. For dev/test without a backend, :inline or :async is acceptable"
      variable_name: "ACTIVE_JOB_ADAPTER"

    - name: "Patch of Mapper::Mapping#normalize_conditions! or other Mapping internals"
      kind: "breaking"
      pattern: "(?<!\\w)(?:normalize_(?:conditions|requirements)!|default_controller_and_action)(?![\\w?!])|\\bRouting::Mapper::Mapping\\b|\\b(?:module[ \\t]+(?:ActionDispatch::)?Routing(?:[ \\t]*;|[ \\t]*(?:#[^\\n]*)?\\r?\\n(?:[ \\t\\r]*(?:#[^\\n]*)?\\n)*)[ \\t]*class[ \\t]+Mapper(?:::Mapping\\b|(?:[ \\t]*;|[ \\t]*(?:#[^\\n]*)?\\r?\\n(?:[ \\t\\r]*(?:#[^\\n]*)?\\n)*)[ \\t]*class[ \\t]+Mapping\\b)|class[ \\t]+(?:::)?ActionDispatch::Routing::Mapper(?:[ \\t]*;|[ \\t]*(?:#[^\\n]*)?\\r?\\n(?:[ \\t\\r]*(?:#[^\\n]*)?\\n)*)[ \\t]*class[ \\t]+Mapping\\b)"
      exclude: ""
      search_paths:
        - "app/"
        - "lib/"
        - "config/"
      explanation: "Rails 4.0 and 4.1 build a route's required_defaults (every option that is not a Regexp, a path segment or an ignored option) in the private ActionDispatch::Routing::Mapper::Mapping#normalize_conditions!. Apps patch it to keep custom route options (authorization metadata, for instance) out of required_defaults, so url_for(controller:, action:) without the named helper still finds the route. Rails 4.2 rewrote Mapping: normalize_conditions!, normalize_requirements! and default_controller_and_action are gone, required_defaults is built in a new private constraints(options, path_params), and normalize_defaults!, normalize_options! and normalize_path! now take arguments. A patch that aliases a removed method (alias_method, alias_method_chain) raises NameError at boot. A patch that overrides it (reopen or prepend) silently stops running, and url_for raises ActionController::UrlGenerationError again. A zero-argument override of normalize_defaults!, normalize_options! or normalize_path! raises ArgumentError when routes are drawn. Mapping#initialize also changed from (set, scope, path, options) to (scope, set, path, defaults, as, options), and the scope, path and options readers are gone, so an initialize override or a hook that reads options breaks too. The pattern flags the removed method names, Routing::Mapper::Mapping references, and a Mapping reopen nested in module Routing / class Mapper, as class Mapper::Mapping inside module Routing, or in class ActionDispatch::Routing::Mapper, with only blank or comment lines (or ;) between. It misses a nested reopen with other code between those lines, or a bare Mapper::Mapping constant written inside module Routing, unless the code names a removed method. The dual-boot fallback in fix: keeps matching (it names normalize_conditions! and Routing::Mapper::Mapping) until the 4.1 branch is removed"
      fix: "Prefer removing the patch. Custom route metadata passed under defaults: (get '/posts/:id' => 'posts#show', defaults: { authorize: :admin }, or scope defaults: { ... }) still lands in params but never becomes a required default, on 4.1 and 4.2 alike, so url_for works without any patch. If the patch must stay, hook the method each side has: normalize_conditions! (no arguments) on 4.1, constraints(options, path_params) on 4.2, selected with NextRails.next?, both private like the methods they wrap (Module#prepend needs Ruby 2.0; on 1.9.3 use alias_method_chain inside the same branches). Port an override of normalize_defaults!, normalize_options! or normalize_path! to the 4.2 signature the same way. Hooking constraints on 4.1 raises ArgumentError at route draw. Rails 5.0 changes constraints again (it returns the options grouped by kind and no longer writes @conditions), so a 4.2 hook breaks at the next hop: drop the patch rather than re-hook it"
      variable_name: "MAPPER_NORMALIZE_CONDITIONS"

  medium_priority:
    - name: "find/exists? with possible AR object argument"
      kind: "deprecation"
      pattern: "\\.(find|exists\\?)\\(\\s*@?[a-z_][a-zA-Z_0-9.]*\\s*\\)"
      exclude: "\\.(find|exists\\?)\\([^)]*\\.id\\s*\\)|\\.(find|exists\\?)\\(\\s*\\d+"
      search_paths:
        - "app/"
        - "lib/"
      explanation: "Rails 4.2 deprecates passing AR objects where an id is expected. Manual review needed — numeric ids and expressions ending in .id are already correct and excluded"
      fix: "Pass .id explicitly when the argument is an AR object (e.g., Comment.find(comment.id) instead of Comment.find(comment))"
      variable_name: "FIND_WITH_OBJECT"

    - name: "HTML sanitizer usage"
      kind: "breaking"
      pattern: "\\b(sanitize|strip_tags|strip_links|sanitize_css)\\b"
      exclude: ""
      search_paths:
        - "app/"
      explanation: "Rails 4.2 rewrites the sanitizer on top of Loofah/Nokogiri. Output may differ for edge-case inputs - review tests that assert sanitized output"
      fix: "Review test assertions on sanitized output. If differences are unacceptable, temporarily add gem 'rails-deprecated_sanitizer'"
      variable_name: "HTML_SANITIZER"

    - name: "Verify test_order is set"
      kind: "deprecation"
      pattern: "\\b(?:Rails\\.application|\\w+::Application)\\.configure\\b"
      exclude: "\\A\\s*#"
      search_paths:
        - "config/environments/test.rb"
      explanation: "FILE MARKER (manual review required): when config.active_support.test_order is not set, Rails 4.2 falls back to :sorted (the 4.1 order) and emits a deprecation warning saying the default becomes :random in Rails 5. The warning comes from ActiveSupport::TestCase.test_order, which runs only when Minitest runs an ActiveSupport::TestCase subclass, so a suite that is RSpec only may never print it. A regex cannot detect a missing setting, so this pattern flags the configure block of config/environments/test.rb: both the Rails.application.configure form (generated by Rails 4.1 and later) and the <App>::Application.configure form (generated by Rails 4.0 and earlier, kept by apps that never regenerated the file). Open the file and check the setting is present, and check test/test_helper.rb for ActiveSupport::TestCase.test_order = (the 4.2 class setter writes the same value, and it runs after the environment file; 4.1 has no such setter, so during the dual boot use the config form). Commented-out configure lines are skipped"
      fix: "If neither config.active_support.test_order in config/environments/test.rb nor ActiveSupport::TestCase.test_order = in test/test_helper.rb is present, add config.active_support.test_order = :sorted inside the configure block to keep the 4.1 order, or :random (the 4.2 generator value and the Rails 5 default) once the suite passes in random order. The line is safe on 4.1 with no conditional: the active_support.set_configs initializer only calls setters that ActiveSupport responds to, and 4.1 has no ActiveSupport.test_order=, so the line is ignored there"
      variable_name: "TEST_ORDER"

    - name: "Serialized attributes with custom coder"
      kind: "breaking"
      pattern: "serialize\\s+:\\w+,\\s*(JSON|YAML|\\w+Coder)"
      exclude: ""
      search_paths:
        - "app/models/"
      explanation: "Rails 4.2 changes how nil is handled with serialized attributes and custom coders - nil now saves NULL instead of passing through the coder"
      fix: "Review code that assigns nil to serialized attributes with custom coders. Check for tests that relied on the coder's nil representation (e.g., 'null' for JSON)"
      variable_name: "SERIALIZED_CUSTOM_CODER"

    - name: "Write into changed_attributes"
      kind: "breaking"
      pattern: "(?<![@\\w])changed_attributes(?:\\(\\))?(?:\\[(?:[^\\[\\]\\n]|\\[[^\\[\\]\\n]*\\])*\\][ \\t]*(?:\\*\\*|<<|>>|\\|\\||&&|[-+*\\/%|&^])?=(?![=~>])|\\s*&?\\.\\s*(?:delete|merge!|reverse_merge!|deep_merge!|update|reverse_update|store|clear|replace|shift|except!|slice!|reject!|select!|filter!|keep_if|delete_if|compact!|transform_values!|transform_keys!|\\[\\]=)(?![\\w!?]))"
      exclude: "\\A\\s*#|NextRails\\.next\\?"
      search_paths:
        - "app/"
        - "lib/"
      explanation: "From Rails 4.2.0, ActiveRecord's changed_attributes returns a frozen copy (super.reverse_merge(attributes_changed_in_place).freeze in attribute_methods/dirty.rb), so changed_attributes[name] = value, changed_attributes.delete(name), merge! and the other in-place Hash writers raise RuntimeError: can't modify frozen ActiveSupport::HashWithIndifferentAccess. Through 4.1 it returned the live hash, and code wrote into it to mark a record, often through a virtual attribute, as changed so save callbacks or versioning would run, or to drop a change. Reads keep working, and so do writes to the @changed_attributes instance variable and to changed_attributes of a plain ActiveModel::Dirty class (only the ActiveRecord override freezes), so check that a hit is inside an ActiveRecord model. A line that mentions NextRails.next? is skipped, so the dual-boot one-liner in fix: scans clean. A local variable named changed_attributes, and the name inside a string, are flagged too. Writes through indirection are missed: send(:changed_attributes), tap blocks, or a copy of the reference (h = changed_attributes; h.delete(k))"
      fix: "To mark an attribute changed with its current value as the old one, call attribute_will_change!(name), which works on 4.1 and 4.2. It records what the reader returns (nil when there is no reader) and keeps the first old value when the attribute is already changed, so it is not a drop-in swap for code that wrote a different value. To record a specific old value, use set_attribute_was(name, old) on 4.2 and keep changed_attributes[name] = old on 4.1 (NextRails.next? ? set_attribute_was(name, old) : changed_attributes[name] = old). To drop a change, use clear_attribute_changes([name]) on 4.2 and changed_attributes.delete(name) on 4.1. Both 4.2 methods are private ActiveModel::Dirty methods: call them from inside the model, and from another object (record.changed_attributes.delete(:token)) use record.send(:clear_attribute_changes, [:token]) or a public model method that wraps it; 4.1 has neither. clear_attribute_changes drops only a change made through a setter: on 4.2 a serialized or JSON column mutated in place stays in changes and is still saved. Keep each branch on one line with NextRails.next? (cond ? new : old), since the pattern skips lines that mention it. Remove the 4.1 branch once the upgrade ships"
      variable_name: "CHANGED_ATTRIBUTES_WRITE"

    - name: "Integration test request path without a leading slash"
      kind: "breaking"
      pattern: "(?:^|[{;]|\\bdo\\b)[ \\t]*(?:\\|[^|\\n]*\\|[ \\t]*)?(?:(?:get|post|put|patch|delete|head)(?:_via_redirect)?|(?:xhr|xml_http_request|request_via_redirect)[ \\t]*\\(?[ \\t]*:(?:get|post|put|patch|delete|head)[ \\t]*,)[ \\t]*\\(?[ \\t]*([\"'])(?![/?#\"']|[a-zA-Z][a-zA-Z0-9+.-]*://)[^\"'\\s]+\\1(?![ \\t]*do\\b)"
      exclude: "\\A\\s*#"
      search_paths:
        - "spec/requests/"
        - "spec/integration/"
        - "spec/api/"
        - "test/integration/"
      explanation: "Rails 4.2 builds the integration request URI as a string, scheme://host:port followed by the path (ActionDispatch::Integration::Session#build_full_uri, new in 4.2.0), so get \"users\" requests http://www.example.com:80users and rack-test raises URI::InvalidURIError (bad URI(is not URI?) on Ruby 2.x). Rails 4.1 resolved the path against \"/\" with URI#+, so the slash was optional. Flags get/post/put/patch/delete/head (and the _via_redirect, xhr, xml_http_request and request_via_redirect forms) at the start of a line or after {, ; or do, whose path argument is a string literal that starts with neither /, ? nor # and does not start with a scheme such as http:// (a URL inside the query, get \"auth/callback?return_to=http://x.com\", is still flagged: 4.2 parses it as a relative URI and the slash is still missing) (a leading ? or # still forms a valid URI on 4.2). Skipped: a string followed directly by do (rswag-style operation blocks such as get \"List users\" do), symbols (get :index), path helpers and variables, routing-spec hashes (get: \"users\"), receivers such as redis.get. Lines that start with # are skipped. Missed: paths with spaces inside #{ }, a path that starts with interpolation (get \"#{id}/edit\"), a request used as an expression (expect(get \"users\"), status = get \"users\"), a request followed by a block (get \"users\" do |r|, read as an rswag description), calls on a session object (sess.get \"users\"), a path on the next line, and request helpers kept in spec/support/ or test/support/, which are not searched because controller shared examples there pass action names (get \"show\"). A spec that includes Rack::Test::Methods directly (Grape or Sinatra apps under spec/api/) is not affected, since rack-test adds the slash itself"
      fix: "Add the leading slash (get \"/users\"), or use a path helper (get users_path). Both work on 4.1 and 4.2, so no dual-boot conditional is needed"
      variable_name: "INTEGRATION_RELATIVE_PATH"

    - name: "serve_static_assets config"
      kind: "deprecation"
      pattern: "serve_static_assets"
      exclude: ""
      search_paths:
        - "config/environments/"
      explanation: "Rails 4.2 renames config.serve_static_assets to config.serve_static_files"
      fix: "Rename config.serve_static_assets to config.serve_static_files. In production.rb, consider using ENV['RAILS_SERVE_STATIC_FILES'].present?"
      variable_name: "SERVE_STATIC_ASSETS"

    - name: "form_authenticity_token in non-Rails forms"
      kind: "breaking"
      pattern: "form_authenticity_token"
      exclude: ""
      search_paths:
        - "app/"
      explanation: "Rails 4.2 masks CSRF tokens per-request for SSL attack mitigation. Non-Rails forms or clients that cache the token break"
      fix: "Fetch the token per request or use Rails form helpers that handle masking automatically"
      variable_name: "CSRF_TOKEN_MASKING"

    - name: "Foreigner gem"
      kind: "migration"
      pattern: "gem.*['\"]foreigner['\"]"
      exclude: ""
      search_paths:
        - "Gemfile"
      explanation: "Rails 4.2 adds native foreign key support (add_foreign_key, t.references foreign_key: true) that can replace Foreigner for most cases"
      fix: "Remove gem 'foreigner', run bundle install, run bin/rake db:schema:dump, verify db/schema.rb. Note: Rails FK support is a subset of Foreigner"
      variable_name: "FOREIGNER"

    - name: "Numeric#ago / until / since / from_now on a bare number"
      kind: "breaking"
      pattern: "(?:(?<![\\w.])\\d+(?:_\\d+)*(?:\\.\\d+)?|\\.(?:to_[if]|abs))\\.(?:ago|until|since|from_now)(?![\\w?!])|(?:\\.(?:round|floor|ceil)(?:\\(\\s*\\d*\\s*\\))?|(?<![\\w)\\]])\\([^()*\\/]*[*\\/][^()]*\\))\\.(?:ago|until|since|from_now)(?![\\w?!(])"
      exclude: "\\A\\s*(?:#(?!\\{)|<%#)"
      search_paths:
        - "app/"
        - "lib/"
        - "config/"
        - "spec/"
        - "test/"
        - "db/"
      explanation: "Rails 4.1 deprecated calling ago, until, since and from_now on a plain number (`Calling #ago or #until on a number (e.g. 5.ago) is deprecated`, and the same for #since / #from_now). Rails 4.2 removes them from Numeric, so `5.ago` raises NoMethodError (undefined method `ago' for 5:Fixnum, or 5:Integer on Ruby 2.4+). Methods on a Duration (`5.seconds.ago`) are unchanged. The pattern flags a numeric literal (`5.ago`, `1.5.since`, `3_600.from_now`), a `.to_i`, `.to_f` or `.abs` result (`1.day.to_i.ago`), a `.round`, `.floor` or `.ceil` result with no argument to the time method (`x.round.ago`, `x.round(2).ago`), and a parenthesized expression with `*` or `/` that is not a method call's argument list, again with no argument to the time method (`(2.hours * 3).ago`, `(TIMEOUT * 4).ago`, `(60 * 60).ago`): through 4.2 a Duration has no `*` or `/` of its own, method_missing hands them to the Integer value and returns a plain Integer, so those calls warn on 4.1 and raise on 4.2. The parenthesized branch spans lines inside the parentheses. Duration `+` and `-` keep a Duration and are not flagged. Time#ago / since and Date#ago / since always take an argument, so the `.round` and parenthesized shapes are flagged only without one: `Time.current.round.ago(1.hour)` and `(Time.now - 2 * 3600).since(1.hour)` are Time calls, and `(TIMEOUT * 4).ago(t)` is missed. Lines that start with `#` (not `#{`) or with an ERB `<%#` comment are skipped; a trailing comment or a string literal such as `\"retry in 5.ago\"` is still flagged. Not detected: a variable holding seconds (`timeout.ago`), such as an Integer read from YAML, ENV or a settings table and handed to a gem that calls ago on it, an Integer on the left of `+` (`(5 + 1.hour).ago`), other Integer-returning calls (`items.count.ago`), parentheses with no `*` or `/` (`(1.day.to_i).ago`), and `1e3.ago` or `0x10.ago`. Those show up as the 4.1 deprecation warning in logs and test output, so fix every such warning on 4.1 before the bump. A Duration plus a product inside one pair of parentheses (`(1.day + 2 * 3.hours).ago`) is flagged although the sum is a Duration, and a nested parenthesis inside the expression hides the call"
      fix: "Give the number a unit: `5.ago` becomes `5.seconds.ago`, `timeout.from_now` becomes `timeout.seconds.from_now`, `(2.hours * 3).ago` becomes `(2.hours * 3).seconds.ago` or `Time.current - 2.hours * 3`. For a value read from configuration, convert it where it is read (`setting.seconds`) so every consumer gets a Duration. A Duration is `==` to its Integer, does arithmetic like it and serializes to JSON as it, but `Integer === duration` (so `case x when Integer`), `eql?` and Hash-key lookups treat it as a different object on 4.1 and 4.2, so check the setting's other consumers before converting at read time. `.seconds` exists on every Rails version, so the fix runs on 4.1 and 4.2 with no NextRails.next? branch"
      variable_name: "NUMERIC_AGO_WITHOUT_UNIT"

    - name: "Column#type_cast instance calls"
      kind: "breaking"
      pattern: "\\.type_cast(?:\\((?![ \\t\\n]*\\))(?!(?:(?:\"(?:[^\"\\\\\\n]|\\\\.)*\"|'(?:[^'\\\\\\n]|\\\\.)*'|\\((?:\"[^\"\\n]*\"|'[^'\\n]*'|[^()\"'])*\\)|[^()\"',]))*,[ \\t\\n]*[^\\s)&])|[ \\t]+(?!(?:if|unless|and|or|rescue|while|until|then|do)\\b)(?=[\\w@:\"'\\[(]|[-*!%]\\S)(?![^\\n,#]*,))|(?:\\b(?:send|public_send|try!?)|\\b__send__)(?:\\([ \\t]*(?::type_cast|\"type_cast\"|'type_cast')[ \\t]*,(?!(?:(?:\"(?:[^\"\\\\\\n]|\\\\.)*\"|'(?:[^'\\\\\\n]|\\\\.)*'|\\((?:\"[^\"\\n]*\"|'[^'\\n]*'|[^()\"'])*\\)|[^()\"',]))*,[ \\t\\n]*[^\\s)&])|[ \\t]+(?::type_cast|\"type_cast\"|'type_cast')[ \\t]*,(?![^\\n,#]*,))"
      exclude: "\\A[ \\t]*(?:#|def\\s)"
      search_paths:
        - "app/"
        - "lib/"
        - "config/"
        - "spec/"
        - "test/"
      explanation: "Rails 4.2.0 removed the instance method ActiveRecord::ConnectionAdapters::Column#type_cast(value) (defined in column.rb through activerecord 4.1.16). A 4.2 column delegates casting to its cast_type through type_cast_from_database and type_cast_from_user, and Type::Value#type_cast is private, so column.type_cast(value) raises NoMethodError. Typical callers cast a param or a calculation result through Model.columns_hash[name].type_cast(value) or column_for_attribute(name).type_cast(value). One-argument calls are flagged, with or without parentheses (a trailing comma or a &block argument still counts as one argument), plus send, public_send, __send__, try and try! with :type_cast or \"type_cast\", with or without parentheses. A zero-argument type_cast() is skipped. try(:type_cast, value) does not raise on 4.2: ActiveSupport try checks respond_to? and quietly returns nil. The two-argument connection.type_cast(value, column) quoting method still exists on 4.2 and is skipped when its comma is at the top level of the call or inside one level of nested parentheses (deeper nesting is flagged; commas inside string literals are ignored, but a parenthesis inside a string inside nested parentheses can still hide a real call, and a paren-less call with a comma later on the line is skipped). Any other object with a public one-argument type_cast is flagged too, so check that the receiver is a column. The removed class-level helpers (Column.value_to_boolean and friends) are a separate change"
      fix: "First check whether the cast does anything: minimum and maximum already cast their result through the column on 4.1 and 4.2, so the cast can simply go. Otherwise branch on the Rails version: NextRails.next? ? column.type_cast_from_database(value) : column.type_cast(value). type_cast_from_database gives the 4.1 result for string, integer, decimal, boolean and datetime inputs, with one difference: a string column now returns a String for any value (5 becomes \"5\"). type_cast_from_user is what an attribute writer uses, but it differs more: a blank string cast through an integer column gives nil instead of 0. Rails 5.0 replaces both with Model.type_for_attribute(name).cast(value)"
      variable_name: "COLUMN_TYPE_CAST_INSTANCE"

  low_priority:
    - name: "Procfile rails server without explicit bind"
      kind: "breaking"
      pattern: "rails\\s+s(erver)?\\s*$|rails\\s+s(erver)?\\s+(?!-b|--binding)"
      exclude: "-b\\s+0\\.0\\.0\\.0|--binding"
      search_paths:
        - "Procfile"
        - "bin/"
      explanation: "Rails 4.2 (via Rack) binds rails server to localhost instead of 0.0.0.0 by default. Docker, Vagrant, and remote-access setups break"
      fix: "Add -b 0.0.0.0 to rails server commands that need external access"
      variable_name: "SERVER_BIND"

    - name: "Timecop gem in use"
      kind: "migration"
      pattern: "gem.*['\"]timecop['\"]|\\bTimecop\\."
      exclude: ""
      search_paths:
        - "Gemfile"
        - "test/"
        - "spec/"
      explanation: "Rails 4.2 adds built-in travel, travel_to, and travel_back helpers via ActiveSupport::Testing::TimeHelpers - these replace most Timecop use cases"
      fix: "Replace Timecop.freeze/return with travel_to/travel_back. Keep Timecop only if you use time-rate features (e.g., 1 sec = 1 hour)"
      variable_name: "TIMECOP"

dependencies:
  responders:
    check: true
    gem_name: "responders"
    message: "Required if controllers use respond_with or class-level respond_to"
    url: "https://github.com/heartcombo/responders"

  web-console:
    check: false
    gem_name: "web-console"
    message: "New Rails 4.2 default - interactive IRB console in development on error pages and via <%= console %> helper"
    url: "https://github.com/rails/web-console"

  rails-deprecated_sanitizer:
