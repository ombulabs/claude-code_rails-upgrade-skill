# Fixture expectations for rails-42-patterns.yml.
#
# Keyed by variable_name (matching the entries in rails-42-patterns.yml). For
# each pattern you cover, list:
#   match     - lines the pattern MUST flag (the real breaking-change shapes)
#   no_match  - lines it MUST NOT flag (safe code + known false-positive traps)
#
# A line is "flagged" when the entry's `pattern` regex matches it AND the
# entry's `exclude` regex (when present) does not: a per-line grep + grep -v.
#
# Run with:
#   bin/test-patterns rails-upgrade/detection-scripts/patterns/rails-42-patterns.yml

COLUMN_TYPE_CAST_INSTANCE:
  match:
    - "    Model.columns_hash[\"amount\"].type_cast(params[:amount])"
    - "  self.class.columns_hash[name.to_s].type_cast(raw)"
    - "  column_for_attribute(:active).type_cast(\"1\")"
    - "  Order.columns_hash[\"total\"].type_cast(Order.maximum(:total))"
    # a comma inside a nested call is not a second argument
    - "  column.type_cast(format(\"%d,%d\", a, b))"
    - "  @column.type_cast value"
    - "  columns_hash[key].try(:type_cast, value)"
    - "  column.send(:type_cast, value)"
    - "  col.try!(:type_cast, value)"
    - "  col.__send__(:type_cast, value)"
  no_match:
    # two-argument connection quoting method, still public on 4.2
    - "  connection.type_cast(value, column)"
    - "  ActiveRecord::Base.connection.type_cast(quote(value), column)"
    - "  conn.type_cast value, column"
    - "  conn.send(:type_cast, value, column)"
    - "  conn.send(:type_cast, quote(value), column)"
    # zero-argument call followed by a modifier, not a one-argument call
    - "  x = col.type_cast if foo"
    # definitions, not calls
    - "  def type_cast(value)"
    - "  def self.type_cast(value)"
    - "  def obj.type_cast(value)"
    # the 4.2 replacements
    - "  column.type_cast_from_database(value)"
    - "  column.type_cast_from_user(value)"
    # also gone on 4.2, but a different method this pattern does not cover
    - "  column.type_cast_for_write(value)"
    # comment line
    - "  # column.type_cast(value)"
