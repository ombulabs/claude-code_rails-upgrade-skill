# Fixture expectations for rails-42-patterns.yml.
#
# Keyed by variable_name (matching the entries in rails-42-patterns.yml). For
# each pattern you cover, list:
#   match     - lines the pattern MUST flag (the real breaking-change shapes)
#   no_match  - lines it MUST NOT flag (safe code + known false-positive traps)
#
# A line is "flagged" when the entry's `pattern` regex matches it AND the
# entry's `exclude` regex (when present) does not, a per-line grep + grep -v.
#
# Run with:
#   bin/test-patterns rails-upgrade/detection-scripts/patterns/rails-42-patterns.yml

MAPPER_NORMALIZE_CONDITIONS:
  # The usual nested reopen (`module Routing`, `class Mapper`, `class Mapping`
  # on separate lines) spans lines, so it cannot be a fixture here. It was
  # checked with a whole-file scan of a multi-line initializer, LF and CRLF.
  # The one-line `;` forms below exercise the same branch.
  match:
    # class Mapper::Mapping reopened inside module Routing
    - "module Routing; class Mapper::Mapping"
    - "      def normalize_conditions!"
    - "        alias_method :normalize_conditions_without_auth!, :normalize_conditions!"
    - "  alias_method_chain :normalize_conditions!, :auth"
    - "      def normalize_requirements!"
    - "        options.merge!(default_controller_and_action)"
    - "ActionDispatch::Routing::Mapper::Mapping.send(:prepend, RouteAuthOptions)"
    - "ActionDispatch::Routing::Mapper::Mapping.class_eval do"
    - "class ActionDispatch::Routing::Mapper::Mapping"
    - "::ActionDispatch::Routing::Mapper::Mapping.class_eval do"
    - "class ActionDispatch::Routing::Mapper; class Mapping"
    - "module ActionDispatch; module Routing; class Mapper; class Mapping"
  no_match:
    # an app namespace under Routing is not the Rails module
    - "module Routing::Admin; class Mapper; class Mapping"
    - "      def normalize_conditions_without_auth!"
    - "  def normalize_conditions(params)"
    - "  normalize_requirements_for(record)"
    - "class Mapping < ActiveRecord::Base"
    - "  belongs_to :mapping"
    - "ActionDispatch::Routing::Mapper.new(set)"
    - "ActionDispatch::Routing::Mapper::Mappings"
    - "Geo::TileMapper::Mapping.new(tile)"
    # an app-owned Mapper::Mapping outside ActionDispatch::Routing
    - "Importers::Mapper::Mapping.new(row)"
    - "class Mapper; class Mapping < Struct.new(:a); end; end"
    - "  default_controller_and_action_name = 'home#index'"

CHANGED_ATTRIBUTES_WRITE:
  match:
    # element writes, including through self, a receiver and ||=
    - "    changed_attributes[\"tag_list\"] = nil"
    - "    changed_attributes[:name] = name_was"
    - "    self.changed_attributes[\"state\"] = old_state"
    - "    changed_attributes[attr] ||= old"
    - "    changed_attributes[:count] += 1"
    # one level of nested index in the key
    - "    changed_attributes[attrs[:name]] = old"
    # in-place Hash writers (a chain split across lines, changed_attributes
    # then .delete(...) on the next line, is matched by scan_patterns.rb
    # which reads whole files; fixtures are single lines)
    - "    changed_attributes.delete(\"updated_at\")"
    - "    record.changed_attributes.delete(:token)"
    - "    changed_attributes.merge!(\"tags\" => old_tags)"
    - "    changed_attributes.reverse_merge!(\"tags\" => old_tags)"
    - "    changed_attributes&.delete(\"x\")"
    - "    changed_attributes.store(\"tags\", old)"
    - "    changed_attributes.clear"
    - "    changed_attributes.except!(*IGNORED)"
    - "    changed_attributes.delete_if { |k, _| k == \"x\" }"
    - "    changed_attributes.reject! { |k, _| k.start_with?(\"_\") }"
    - "    changed_attributes().update(\"a\" => 1)"
    - "    changed_attributes.deep_merge!(\"a\" => 1)"
    - "    changed_attributes.reverse_update(\"a\" => 1)"
    - "    changed_attributes.replace({})"
    - "    changed_attributes.shift"
    - "    changed_attributes.slice!(\"a\")"
    - "    changed_attributes.select! { |k, _| k }"
    - "    changed_attributes.keep_if { |k, _| k }"
    - "    changed_attributes.compact!"
    - "    changed_attributes.transform_values!(&:to_s)"
    - "    changed_attributes.[]=(attr, old)"
    - "    changed_attributes[:a] &&= nil"
    - "    changed_attributes[:flags] <<= 1"
  no_match:
    # reads and copies keep working on 4.2
    - "    old = changed_attributes[\"name\"]"
    - "    if changed_attributes[\"name\"] == \"x\""
    - "    changed_attributes[:a] != 1"
    - "    changed_attributes[keys[0]] <= 1"
    - "    changed_attributes.reverse_merge(\"a\" => 1)"
    - "    changed_attributes[\"a\"] =~ /x/"
    - "    { changed_attributes[\"a\"] => 1 }"
    - "    changed_attributes.key?(\"name\")"
    - "    changed_attributes.merge(\"a\" => 1)"
    - "    changed_attributes.except(\"updated_at\")"
    - "    changed_attributes.dup.delete(\"x\")"
    - "    changed_attributes.keys.delete(\"x\")"
    # the instance variable is the unfrozen ActiveModel hash
    - "    @changed_attributes[\"name\"] = old"
    - "    @changed_attributes.delete(\"name\")"
    # the replacements, definitions, lookalike names and comments
    - "    attribute_will_change!(\"tag_list\")"
    - "    set_attribute_was(\"name\", old)"
    - "    clear_attribute_changes([\"name\"])"
    - "    def changed_attributes"
    - "    my_changed_attributes.delete(\"x\")"
    - "    changed_attributes_for(:x).delete(\"x\")"
    - "    changed_attributes.update_counters"
    - "    # changed_attributes[\"name\"] = old"
    # the dual-boot one-liners from fix: (exclude)
    - "    NextRails.next? ? clear_attribute_changes([\"updated_at\"]) : changed_attributes.delete(\"updated_at\")"
    - "    NextRails.next? ? set_attribute_was(name, old) : changed_attributes[name] = old"
    - "    changed_attributes.compact"

INTEGRATION_RELATIVE_PATH:
  match:
    # a URL in the query still leaves a relative path on 4.2
    - "get \"auth/callback?return_to=http://x.com\""
    - "    get \"users\""
    - "get 'assets/app.css'"
    - "    post \"users\", user: { name: \"x\" }"
    - "get(\"users.json\")"
    - "  delete \"users/#{user.id}\""
    - "head \"status\""
    # "users?page=2" breaks too: only a leading ? is safe
    - "get \"users?page=2\""
    # request inside a { } block
    - "  expect { post \"users\", user: attrs }.to change(User, :count).by(1)"
    - "  before { get \"dashboard\" }"
    # xhr / redirect-following forms take the path as the second argument
    - "  xhr :get, \"users\""
    - "xhr(:post, \"comments\", body: \"x\")"
    - "xml_http_request :get, \"users\""
    - "request_via_redirect :get, \"login\""
    - "  get_via_redirect \"login\""
    - "post_via_redirect \"sessions\", user: user"
    # one-line blocks and statements after ;
    - "  before do get \"users\" end"
    - "  scenario \"x\" do; get \"users\"; end"
    # a do later on the line, or in a comment, does not hide the request
    - "get \"users\", params: { q: \"do\" }"
    - "get \"users\" # do"
  no_match:
    - "    get \"/users\""
    - "get '/assets/app.css'"
    - "  xhr :get, \"/users\""
    # a full URL sets the host and path itself on both versions
    - "get \"http://www.example.com/users\""
    - "get \"https://api.example.com/users\""
    # an interpolated prefix may already hold the slash
    - "get \"#{base_path}/users\""
    # "?page=2" works on 4.2 (http://www.example.com:80?page=2 is a valid URI)
    - "get \"?page=2\""
    - "get \"\""
    # symbols, path helpers and variables: not a literal relative path
    - "get :index"
    - "get users_path"
    - "get path, params"
    # rswag-style operation blocks: the string is a description, not a path
    - "    get \"List users\" do"
    - "  post \"create\" do |example|"
    - "  get \"index\" do"
    # routing-spec hashes
    - "expect(get: \"users\").to route_to(\"users#index\")"
    - "expect(:get => \"users\").to be_routable"
    # comments and RSpec descriptions
    - "# get \"users\""
    - "describe \"GET users\" do"
    - "it \"gets users\" do"
    # receivers and lookalike names
    - "value = redis.get \"key\""
    - "Net::HTTP.get(\"example.com\", \"/\")"
    - "target \"users\""
    - "forget \"users\""
    - "undo \"users\""
    - "it \"does get users\" do"
    # a fragment-only path forms a valid URI on 4.2
    - "get \"#anchor\""
    # comment lines (exclude)
    - "# before { get \"users\" }"
    - "  # TODO: do get \"users\" later"
    # a full URL is skipped only when the scheme starts the string
    - "get \"https://api.example.com/users\""

# Known gap, not a fixture because it does break on 4.2: a space inside #{ }
# stops the path match, so get "users/#{ user.id }" is not flagged.

NUMERIC_AGO_WITHOUT_UNIT:
  match:
    # numeric literals, including floats, underscores and a leading minus
    - "    expires_at = 5.ago"
    - "Time.zone.now > 30.from_now"
    - "x = 1.5.since(start)"
    - "cutoff = 3_600.from_now"
    - "  let(:time) { -30.from_now }"
    - "<%= 5.ago %>"
    # to_i / to_f results, including a Duration turned back into an Integer
    - "session_timeout.to_i.ago"
    - "params[:seconds].to_f.until(deadline)"
    - "1.day.to_i.ago"
    - "x.round.ago"
    - "value.abs.from_now"
    - "(a.to_f / b).round.ago"
    - "x.round(2).ago"
    # a line that continues a string with interpolation is not a comment
    - "  #{5.ago}"
    # Duration * and / return a plain Integer through 4.2. A product split
    # across lines inside the parentheses is matched by scan_patterns.rb, which
    # reads the whole file
    - "where(updated_at: (2.hours * 3).ago..Time.now)"
    - "(1.day / 2).from_now"
    - "(TIMEOUT * 4).ago"
    - "(60 * 60).ago"
  no_match:
    - "expires_at = 5.seconds.ago"
    - "2.days.from_now"
    - "Time.current.ago(5)"
    - "Date.today.since(3)"
    - "(1.day + 1.hour).ago"
    - "(n * 1.day).seconds.ago"
    - "(Time.now - 5).ago(1)"
    - "foo(x * 2).bar(1.day.ago)"
    - "# 5.ago is deprecated"
    - "  # use 5.seconds.ago, not 5.ago"
    - "record.agony"
    - "5.agos"
    - "v1.2.ago"
    - "foo.to_iso.ago"
    - "time.since?"
    - "<%# 5.ago %>"
    # Time and Date arithmetic: their ago / since always take an argument
    - "(Time.now - 2 * 3600).since(1.hour)"
    - "(Date.today + 7/2).since(1.day)"
    - "Time.current.round.ago(1.hour)"
    - "Time.now.floor.since(5)"
    # a method call's argument list is not a bare product
    - "Time.at(ts / 1000).since(1.day)"
    - "Time.at(ms * 0.001).ago(1.hour)"
    - "Time.zone.parse(\"2020/01/01\").ago(1.day)"
    - "Date.strptime(s, \"%m/%d/%Y\").since(3.days)"
    - "list[i * 2].ago"

# TEST_ORDER is a file marker: it flags the configure block of test.rb for
# manual review. A per-line exclude cannot see whether test_order is set on
# another line, so a file that already sets it is still flagged.
TEST_ORDER:
  match:
    # Rails 4.1 and later generator form
    - "Rails.application.configure do"
    # Rails 4.0 and earlier generator form, kept by apps that never regenerated test.rb
    - "MyApp::Application.configure do"
    - "Acme::Store::Application.configure do"
    - "::MyApp::Application.configure do"
    # brace block
    - "Rails.application.configure {"
  no_match:
    - "  config.active_support.test_order = :sorted"
    - "Rails.application.config.active_support.test_order = :random"
    - "MyApp::ApplicationController.configure"
    - "Rails.application.configured?"
    # commented-out configure lines (exclude)
    - "# MyApp::Application.configure do"
    - "  # Rails.application.configure do"
