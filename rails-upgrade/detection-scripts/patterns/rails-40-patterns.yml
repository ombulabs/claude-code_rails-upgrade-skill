version: "4.0"
description: "Breaking change patterns for Rails 3.2 → 4.0 upgrade"

upgrade_findings:
  high_priority:
    - name: "attr_accessible usage"
      kind: "breaking"
      pattern: "attr_accessible"
      exclude: ""
      search_paths:
        - "app/models/"
        - "lib/"
      explanation: "Rails 4.0 replaces attr_accessible with Strong Parameters in controllers"
      fix: "Create *_params methods in controllers using params.require(:model).permit(:attrs), then remove attr_accessible from models"
      variable_name: "ATTR_ACCESSIBLE"

    - name: "attr_protected usage"
      kind: "breaking"
      pattern: "attr_protected"
      exclude: ""
      search_paths:
        - "app/models/"
        - "lib/"
      explanation: "Rails 4.0 replaces attr_protected with Strong Parameters in controllers"
      fix: "Create *_params methods in controllers with explicit permit lists, then remove attr_protected from models"
      variable_name: "ATTR_PROTECTED"

    - name: "require strong_parameters"
      kind: "breaking"
      pattern: "require.*strong_parameters"
      exclude: ""
      search_paths:
        - "app/"
        - "lib/"
        - "config/"
      explanation: "The strong_parameters gem is built into Rails 4.0 — require calls will fail"
      fix: "Remove require 'strong_parameters' calls entirely"
      variable_name: "REQUIRE_STRONG_PARAMS"

    - name: "Scope without lambda"
      kind: "breaking"
      pattern: "scope\\s+:\\w+\\s*,\\s*where"
      exclude: ""
      search_paths:
        - "app/models/"
      explanation: "Rails 4.0 requires all scopes to use a lambda"
      fix: "Change scope :name, where(...) to scope :name, -> { where(...) }"
      variable_name: "SCOPE_WITHOUT_LAMBDA"

    - name: "default_scope without block"
      kind: "breaking"
      pattern: "default_scope\\s+(where|order|:order)"
      exclude: ""
      search_paths:
        - "app/models/"
      explanation: "Rails 4.0 requires default_scope to use a block"
      fix: "Change default_scope where(...) to default_scope { where(...) }"
      variable_name: "DEFAULT_SCOPE_WITHOUT_BLOCK"

    - name: "Association :conditions option"
      kind: "deprecation"
      pattern: "(has_many|has_one|belongs_to|has_and_belongs_to_many).*:?conditions(:|\\s*=>)"
      exclude: ""
      search_paths:
        - "app/models/"
      explanation: "Rails 4.0 moved :conditions out of core, but activerecord-deprecated_finders (a default dependency of Rails 4.0, removed in 4.1) restores it with a deprecation warning, so it keeps working at the 4.0 hop. Rewrite to a scope lambda before dropping the gem or moving to 4.1. A proc-valued :conditions has a receiver subtlety covered separately by ASSOCIATION_CONDITIONS_PROC"
      fix: "Move conditions into a scope lambda: has_many :items, -> { where(active: true) }. Works on Rails 3.2 and 4.0+"
      variable_name: "ASSOCIATION_CONDITIONS"

    - name: "Association :order option"
      kind: "deprecation"
      pattern: "(has_many|has_one|belongs_to|has_and_belongs_to_many).*[^_]:?order(:|\\s*=>)"
      exclude: ""
      search_paths:
        - "app/models/"
      explanation: "Rails 4.0 moved :order out of core, but activerecord-deprecated_finders (a default dependency of Rails 4.0, removed in 4.1) restores it with a deprecation warning, so it keeps working at the 4.0 hop. Rewrite to a scope lambda before dropping the gem or moving to 4.1"
      fix: "Move order into a scope lambda: has_many :items, -> { order('position ASC') }. Works on Rails 3.2 and 4.0+"
      variable_name: "ASSOCIATION_ORDER"

    - name: "Association :extend option"
      kind: "breaking"
      pattern: "(has_many|has_one|belongs_to|has_and_belongs_to_many).*:?extend(:|\\s*=>)"
      exclude: ""
      search_paths:
        - "app/models/"
      explanation: "Rails 4.0 removed :extend from associations. Unlike :conditions / :order / :uniq / :readonly, activerecord-deprecated_finders does NOT restore :extend, so this one actually breaks at the 4.0 hop and stays breaking. Use extending() inside a scope lambda"
      fix: "Move extend into a scope lambda: has_many :items, -> { extending SomeExtension }"
      variable_name: "ASSOCIATION_EXTEND"

    - name: "Association :uniq option"
      kind: "deprecation"
      pattern: "(has_many|has_and_belongs_to_many).*:?uniq(:|\\s*=>)"
      exclude: ""
      search_paths:
        - "app/models/"
      explanation: "Rails 4.0 moved :uniq out of core, but activerecord-deprecated_finders (a default dependency of Rails 4.0, removed in 4.1) restores it with a deprecation warning, so it keeps working at the 4.0 hop. Rewrite to a scope lambda with distinct before dropping the gem or moving to 4.1"
      fix: "Move uniq into a scope lambda: has_many :items, -> { distinct }, through: :joins. Works on Rails 3.2 and 4.0+"
      variable_name: "ASSOCIATION_UNIQ"

    - name: "Association :finder_sql option"
      kind: "deprecation"
      pattern: ":?finder_sql(:|\\s*=>)"
      exclude: ""
      search_paths:
        - "app/models/"
      explanation: "Rails 4.0 deprecated `:finder_sql` with no direct in-place replacement. The Rails-4-canonical form is `has_many :name, -> { where(...) }, class_name: ...`, but the lambda-as-second-arg signature on `has_many` raises `ArgumentError: wrong number of arguments (given 3, expected 1..2)` on Rails 3.2 — verified on 3.2.22.5. A naive pre-bump rewrite breaks 3.2 boot"
      fix: "Defer to dual-boot and branch the association definition with `NextRails.next?`. Common 3.2 use case is `finder_sql: \"SELECT id FROM x WHERE id IS NULL\"` as a deliberate always-empty stub for `accepts_nested_attributes_for`; preserve that intent in the dual-boot branch. FK gotcha: the scope-form replacement (`has_many :foo, -> { none }, class_name: \"Foo\"`) restores Rails' default FK predicate. Rails 4 computes `<owner_class_name>_id` as the FK column on the associated table — for self-referential associations or any case where the implied FK column does not exist, accessing the association raises an unknown-column SQL error even when the scope returns no rows. Pin `foreign_key:` and `primary_key:` to existing columns on both sides; for an always-empty stub used purely by `accepts_nested_attributes_for`, `foreign_key: :id, primary_key: :id` is a safe default"
      variable_name: "FINDER_SQL"

    - name: "Dynamic finders (find_all_by_*)"
      kind: "deprecation"
      pattern: "find_all_by_"
      exclude: ""
      search_paths:
        - "app/"
        - "lib/"
      explanation: "Dynamic finders like find_all_by_* are deprecated in Rails 4.0 but continue to work because Rails 4.0 ships activerecord-deprecated_finders as a default dependency. The finders are actually removed in Rails 4.1, when the bridge gem is no longer bundled"
      fix: "Two valid paths. (1) Defer: leave the calls in place for the 3.2 → 4.0 hop and rely on the bundled activerecord-deprecated_finders gem; rewrite at the 4.0 → 4.1 hop where the gem is no longer default. (2) Pre-bump cleanup: replace find_all_by_column(val) with where(column: val) — works on Rails 3.2 and 4.0+. Note the return-type shift: find_all_by_* returned an Array; where(...) returns an ActiveRecord::Relation. If downstream code uses Array-specific methods (.flatten, indexed access, Array#-), add .to_a"
      variable_name: "FIND_ALL_BY"

    - name: "Dynamic finders (find_or_create_by_*)"
      kind: "deprecation"
      pattern: "find_or_create_by_"
      exclude: ""
      search_paths:
        - "app/"
        - "lib/"
      explanation: "Dynamic finders like find_or_create_by_* are deprecated in Rails 4.0 but continue to work because Rails 4.0 ships activerecord-deprecated_finders as a default dependency. The finders are actually removed in Rails 4.1, when the bridge gem is no longer bundled"
      fix: "Two valid paths. (1) Defer: leave the calls in place for the 3.2 → 4.0 hop and rely on the bundled activerecord-deprecated_finders gem; rewrite at the 4.0 → 4.1 hop. (2) Pre-bump cleanup: replace find_or_create_by_column(val) with find_or_create_by(column: val). Both forms work on Rails 3.2 and 4.0+, so the rewrite is backwards-compatible"
      variable_name: "FIND_OR_CREATE_BY"

    - name: "Dynamic finders (find_or_initialize_by_*)"
      kind: "deprecation"
      pattern: "find_or_initialize_by_"
      exclude: ""
      search_paths:
        - "app/"
        - "lib/"
      explanation: "Dynamic finders like find_or_initialize_by_* are deprecated in Rails 4.0 but continue to work because Rails 4.0 ships activerecord-deprecated_finders as a default dependency. The finders are actually removed in Rails 4.1, when the bridge gem is no longer bundled"
      fix: "Two valid paths. (1) Defer: leave the calls in place for the 3.2 → 4.0 hop and rely on the bundled activerecord-deprecated_finders gem; rewrite at the 4.0 → 4.1 hop. (2) Pre-bump cleanup: replace find_or_initialize_by_column(val) with find_or_initialize_by(column: val). Both forms work on Rails 3.2 and 4.0+, so the rewrite is backwards-compatible"
      variable_name: "FIND_OR_INITIALIZE_BY"

    - name: "Dynamic finders (find_last_by_*)"
      kind: "deprecation"
      pattern: "find_last_by_"
      exclude: ""
      search_paths:
        - "app/"
        - "lib/"
      explanation: "Dynamic finders like find_last_by_* are deprecated in Rails 4.0 but continue to work because Rails 4.0 ships activerecord-deprecated_finders as a default dependency. The finders are actually removed in Rails 4.1, when the bridge gem is no longer bundled"
      fix: "Two valid paths. (1) Defer: leave the calls in place for the 3.2 → 4.0 hop and rely on the bundled activerecord-deprecated_finders gem; rewrite at the 4.0 → 4.1 hop. (2) Pre-bump cleanup: replace find_last_by_column(val) with where(column: val).last. Both forms work on Rails 3.2 and 4.0+, so the rewrite is backwards-compatible"
      variable_name: "FIND_LAST_BY"

    - name: "Association :readonly option on through"
      kind: "deprecation"
      pattern: "(has_many|has_and_belongs_to_many).*:?readonly(:|\\s*=>)"
      exclude: ""
      search_paths:
        - "app/models/"
      explanation: "Rails 4.0 moved :readonly out of core, but activerecord-deprecated_finders (a default dependency of Rails 4.0, removed in 4.1) restores it with a deprecation warning, so it keeps working at the 4.0 hop. Move it to a scope lambda before dropping the gem or moving to 4.1"
      fix: "Move readonly into a scope lambda: has_many :items, -> { readonly }, through: :joins. Works on Rails 3.2 and 4.0+"
      variable_name: "ASSOCIATION_READONLY"

    - name: "Ruby 1.8 version requirement"
      kind: "breaking"
      pattern: "ruby.*['\"]1\\.8"
      exclude: ""
      search_paths:
        - "Gemfile"
        - ".ruby-version"
      explanation: "Rails 4.0 requires Ruby 1.9.3+ (2.0+ recommended) — it will not boot on Ruby 1.8"
      fix: "Upgrade Ruby to 1.9.3+ (2.1+ recommended)"
      variable_name: "RUBY_VERSION"

    - name: "Route match without HTTP method"
      kind: "breaking"
      pattern: "^\\s*match\\s+['\"/]"
      exclude: "via:"
      search_paths:
        - "config/routes.rb"
        - "config/routes/"
      explanation: "Rails 4.0 requires match routes to specify an HTTP method via: option. Rails 3.2's bare match accepted all verbs, so any non-GET request (POST/PUT/PATCH/DELETE) currently served by a matchless match route will silently 404 if the fix narrows the verb list. Also note: on Rails 3.2 `via: :all` is treated as literal HTTP method name `\"ALL\"` and 404s every request — the any-verb special-casing only exists on Rails 4+. Verified on Rails 3.2.22.5 with Rack::MockRequest"
      fix: "Default to the behavior-preserving explicit verb list: `via: [:get, :post, :put, :patch, :delete]`. Works identically on Rails 3.2 and 4.0+, zero behavior delta from the matchless-match default. Only narrow to `via: :get` (or another single verb) after a per-route audit confirms the route is GET-only — otherwise POST/PUT/etc. silently 404 after the rewrite, and the regression often first surfaces in production because spec suites rarely cover every verb on every route. NEVER emit `via: :all` — on Rails 3.2 it 404s every request. Verb-tightening is a separate workstream from the upgrade rewrite"
      variable_name: "MATCH_WITHOUT_VIA"

    - name: "config.whiny_nils"
      kind: "breaking"
      pattern: "config\\.whiny_nils"
      exclude: ""
      search_paths:
        - "config/"
      explanation: "config.whiny_nils was a Rails 2.x/3.x debugging affordance that made calls on nil raise a more helpful NoMethodError. Removed in Rails 4.0 — setting it raises NoMethodError on app boot"
      fix: "Delete the config.whiny_nils = true line entirely. No replacement — Ruby's own nil-method errors are sufficient. False-positive watch: matches in comments documenting the removal; verify the hit is an actual assignment, not a comment"
      variable_name: "WHINY_NILS"

    - name: "CollectionProxy guarded by is_a?(Enumerable)"
      kind: "breaking"
      pattern: "(?:is_a\\?|kind_of\\?)\\s*\\(?\\s*Enumerable\\b"
      exclude: "^\\s*#"
      search_paths:
        - "app/"
        - "lib/"
      explanation: "On Rails 4 CollectionProxy was rewritten to inherit from ActiveRecord::Relation and no longer includes Enumerable directly. Code branching on `value.is_a?(Enumerable)` to decide single-record vs collection misclassifies CollectionProxy as a single record on Rails 4. The check was correct on Rails 3.2 because CollectionProxy was a delegating proxy that forwarded is_a? to its underlying Array target via method_missing — silently shifts to wrong on Rails 4 with no error. Matches both `is_a?` and its synonym `kind_of?`, with or without parentheses. Out of scope: the `Enumerable === value` (case/when) form — check those by hand"
      fix: "Broaden the guard: `value.is_a?(Enumerable) || value.is_a?(::ActiveRecord::Relation)`. Correct under both versions: Rails 3.2 CollectionProxy is not a Relation subclass, so the new branch is false there and the original short-circuit behavior is preserved; Rails 4.0 CollectionProxy < Relation, so the new branch correctly classifies it as a collection. Backwards-compatible — applies directly to the current side. The leading `::` is required: inside a scope that shadows ActiveRecord (e.g. `class MyApp::ActiveRecord < ::ActiveRecord::Base`), bare `ActiveRecord::Relation` resolves to the shadowed inner constant and raises NameError"
      variable_name: "COLLECTION_PROXY_ENUMERABLE_GUARD"

    - name: "HashWithIndifferentAccess#convert_value override with 1-arg signature"
      kind: "breaking"
      pattern: "def convert_value\\(\\s*\\w+\\s*\\)"
      exclude: "^\\s*#"
      search_paths:
        - "app/"
        - "lib/"
      explanation: "Rails 4 changed `HashWithIndifferentAccess#convert_value` to take a second argument (`options = {}`). Overrides with the 1-arg signature raise `ArgumentError: wrong number of arguments (given 2, expected 1)` on Rails 4 the first time AR calls the method during a hash mutation. Matches a single-argument override regardless of the parameter name (`value`, `v`, `val`, …); the correct 2-arg form is not flagged"
      fix: "Add `_options = {}` (ignored) as a second parameter to the override: `def convert_value(value, _options = {})`. Rails 3.2 does not pass the second argument, so the default value is used and behavior is unchanged on the current side. Backwards-compatible — applies directly without a NextRails.next? branch"
      variable_name: "HWIA_CONVERT_VALUE_OVERRIDE"

    - name: "Rack::Lock middleware positioning (insert / insert_after / swap)"
      kind: "breaking"
      pattern: "config\\.middleware\\.(insert|insert_before|insert_after|swap)[\\s(]+[\"']?(?:::)?Rack::Lock"
      exclude: "^\\s*#"
      search_paths:
        - "config/"
      explanation: "Rails 4.0 did NOT remove Rack::Lock from the default middleware stack; it changed the conditional that inserts it. On 3.2 the line is `use ::Rack::Lock unless config.allow_concurrency` (default false, so always present). On 4.0 it is `unless allow_concurrency?`, which falls back to `config.cache_classes` when `config.allow_concurrency` is nil (the 4.0 default). So wherever `cache_classes` is true (production, and the test env under CI) Rack::Lock is skipped, and any MiddlewareStack call that names it as a target raises at boot via `assert_index`: `RuntimeError: No such middleware to insert before: Rack::Lock` (or `after`). The raising methods are `insert` (alias `insert_before`), `insert_after`, and `swap`; `use`, `unshift`, and `delete` do not raise. The pattern matches all four raising forms (space and paren styles), the leading-`::` (`::Rack::Lock`) and string (`\"Rack::Lock\"`) target forms, and excludes the integer-index `insert(0, ...)`. Where cache_classes is false (development) it still boots, so this passes locally and only fails in CI/production"
      fix: "Set `config.allow_concurrency = false` in the environment whose stack is missing Rack::Lock (usually `config/environments/test.rb`). This bypasses the cache_classes fallback in `allow_concurrency?`, so Rack::Lock is reinstated and the original positioning call (insert / insert_before / insert_after / swap) works unchanged on both versions, in the same middleware slot, with no NextRails.next? branch. On Rails 3.2 `allow_concurrency` already defaults to false, so the explicit value is a no-op there. Caution: if the environment already sets `allow_concurrency = true` on purpose (some Capybara/Selenium suites do this to avoid Rack::Lock's non-reentrant mutex deadlocking a JS-driver test run), do not flip it to false — that reintroduces the deadlock the app was avoiding. In that case, reposition the middleware relative to a stable anchor instead of Rack::Lock. Verify with `RAILS_ENV=test bundle exec rake middleware` and the Gemfile.next equivalent that the middleware sits in the same slot on both sides"
      variable_name: "RACK_LOCK_MIDDLEWARE"

    - name: "has_paper_trail with string :versions / :version option"
      kind: "breaking"
      pattern: "has_paper_trail.*\\bversions?\\s*(?::|=>)\\s*[\"']"
      exclude: "^\\s*#"
      search_paths:
        - "app/models/"
      explanation: "has_paper_trail forwards the `versions:` / `version:` option value straight into an internal `has_many` / `has_one` call as the association name, with no `to_sym`. This surfaces when paper_trail is bumped on the next side of a dual-boot (`gem \"paper_trail\", \"3.0.0\"` when next?, else `\"~> 2\"`): 2.7.2 pins to Rails-3 ActiveRecord, but 3.0.0 runs against Rails-4 ActiveRecord, which raises `ArgumentError: association names must be a Symbol` (the check ActiveRecord added in 4.0.0) when the name is a string. Boot-fatal on the next side for any model carrying the string form"
      fix: "Change the option value to a symbol: `versions: \"audits\"` becomes `versions: :audits` (same for `version:`). Symbols are accepted on paper_trail 2.x and 3.0.0, so the rewrite ships pre-bump and is backwards-compatible. Single- and double-quoted strings both need rewriting. Matches both the 1.9 hash syntax `versions: \"x\"` and the Ruby-1.8 hash-rocket `:versions => \"x\"` common in 3.2-era code"
      variable_name: "PAPER_TRAIL_STRING_VERSIONS"

    - name: "validates_as_paranoid (rails3_acts_as_paranoid DSL)"
      kind: "breaking"
      pattern: "\\bvalidates_as_paranoid\\b"
      exclude: "^\\s*#"
      search_paths:
        - "app/models/"
      explanation: "`validates_as_paranoid` is a class-method DSL provided by `rails3_acts_as_paranoid` (Rails-3-only soft-delete gem). When that gem is gated `unless next?` in the Gemfile — the typical disposition because the gem is unmaintained on Rails 4+ — call sites raise `NoMethodError: undefined method 'validates_as_paranoid' for ...` at model class-load on the next side. Boot-fatal, surfaced by an eager-load smoke test. The `paranoia` replacement gem (the standard Rails-4-compatible soft-delete replacement that pairs with `acts_as_paranoid`) does NOT provide `validates_as_paranoid` — its default_scope automatically excludes soft-deleted records from `Model.where(...)` uniqueness validations, so the explicit declaration is unnecessary on the next side"
      fix: "Guard the call with `unless NextRails.next?`: `validates_as_paranoid unless NextRails.next?`. With paranoia's default_scope, uniqueness validators using `Model.where(...)` automatically skip soft-deleted records, so the explicit declaration is redundant on Rails 4+. Same guard applies if the codebase keeps `rails3_acts_as_paranoid` gated `unless next?` without swapping to paranoia — the call site is a no-op on the next side either way"
      variable_name: "VALIDATES_AS_PARANOID"

    - name: "Modern JS-compressor gem requires newer Sprockets than Rails 4 ships"
      kind: "breaking"
      pattern: "gem\\s+['\"](terser|closure-compiler)['\"]"
      exclude: ""
      search_paths:
        - "Gemfile"
      explanation: "Only fires when terser or closure-compiler is in the Gemfile — apps on plain uglifier never see this entry. Modern JS-compressor gems (terser, closure-compiler) declare a runtime dependency on `sprockets/digest_utils`, which exists only in Sprockets >= 3. Rails 4.0 locks Sprockets to the 2.x line via sprockets-rails. On Rails 4.0's next side the bundle resolves cleanly (gemspec passes railsbump's check) but the gem's railtie loads at boot and raises `LoadError: cannot load such file -- sprockets/digest_utils`. Invisible to railsbump because the failure is at require-time, after the bundle is locked. Apps reach for terser deliberately (modern JS the abandoned uglifier 4.2.0 cannot compile: ES2020 optional chaining `?.`, UTF-8 source), so you cannot simply swap it for uglifier on the next side without losing those assets. For uglifier itself the breaking versions are 4.x+, so a hit on a bare `gem \"uglifier\"` needs a version-pin check"
      fix: "Keep terser on the next side but stop its railtie from auto-loading on Sprockets 2.x: `gem \"terser\", require: false` (require: false is mandatory or boot dies with the LoadError). Add `gem \"uglifier\", \">= 1.3.0\"` on the next side too, only so the `:uglifier` symbol resolves in environment configs, then register Terser as the real compressor at compile time via a rake task hooked on assets:environment. The current (Rails 3.2) side keeps plain `gem \"terser\"` (its railtie is harmless there). Full recipe with Gemfile, env-config, and rake-task examples: rails-upgrade/references/js-compressor-sprockets-mismatch.md"
      variable_name: "JS_COMPRESSOR_GEM_MISMATCH"

    - name: "validates_format_of with multiline anchors (^...$)"
      kind: "breaking"
      pattern: "validates_format_of.*\\bwith(?::|\\s*=>)\\s*/[^/]*[\\^$]"
      exclude: ""
      search_paths:
        - "app/models/"
      explanation: "Rails 4 raises `ArgumentError: The provided regular expression is using multiline anchors (^ or $), which may present a security risk. Did you mean to use \\A and \\z, or forgot to add the :multiline => true option?` whenever a `validates_format_of` regex source STARTS with `^` or ENDS with `$` (unescaped). New in 4.0 — Rails 3.2 does not perform this check. The validator runs check_options_validity at model class-load, so the error is boot-fatal. Matches both the 1.9 hash syntax `with: /.../` and the Ruby-1.8 hash-rocket `:with => /.../` still common in Rails 3.2-era code. Detection caveat: this grep flags any `^` or `$` inside the `with:` regex, but Rails only raises on a leading `^` or trailing `$`. A `^` inside a character class (e.g. `/[^@]+/`) or a `$` mid-pattern is a FALSE POSITIVE — confirm the anchor sits at the start/end before fixing. Out of scope for the primary regex: the block-options form `validates :col, format: { with: /^.../ }`, method-call regex args (`with: regex_for(:x)`), and positional / `without:` regexes — see fix for a secondary grep"
      fix: "Replace a leading `^` with `\\A` and a trailing `$` with `\\z` (absolute start/end of string). Ruby's regex engine accepts both forms on every Rails version, so apply the rewrite directly — it is backwards-compatible and needs no version gate. Secondary grep for the block-options form: `grep -rnE \"validates\\s+:\\w+.*format:.*?/[^/]*[\\^$]\" app/ --include=\"*.rb\"`. For method-call regex args, fix at the helper method's return value — one fix covers every caller"
      variable_name: "VALIDATES_FORMAT_OF_ANCHORS"

    - name: "Regex constant built via Regexp.new with multiline anchors"
      kind: "breaking"
      pattern: "Regexp\\.new\\(.*[\\^$]"
      exclude: ""
      search_paths:
        - "app/"
        - "lib/"
      explanation: "Companion to VALIDATES_FORMAT_OF_ANCHORS. A regex constant defined via `Regexp.new(%q{^...$})` (or `Regexp.new(\"^...$\")`) is invisible to the primary anchor grep, which looks for literal `/^.../` regexes inline. Apps commonly extract validation regexes into constants — `EMAIL = Regexp.new(%q{^[^@]+@[^@]+$})` — then reference them by name in `validates_format_of`. Rails 4 still raises at model class-load when check_options_validity examines the constant's compiled regex. Same leading/trailing rule as the primary pattern: Rails raises only when the compiled source starts with `^` or ends with `$`. This grep flags any `^` / `$` after `Regexp.new(` (including a `^` inside a character class), so per-match judgment is required"
      fix: "Same rewrite as the primary pattern: `\\A` for `^`, `\\z` for `$`, applied at the constant's definition. One fix covers every caller. Backwards-compatible — Ruby accepts `\\A` / `\\z` on every Rails version. Per-match judgment required: not every `Regexp.new` constant feeds a validator. `String#match` / `String#scan` callers operating on multi-line input may need `^` / `$` for start/end-of-line semantics. Inspect call sites (`grep -rnE \"\\b<CONSTANT_NAME>\\b\" app/ lib/`) and only rewrite when every consumer is OK with absolute-anchor semantics"
      variable_name: "VALIDATES_FORMAT_OF_ANCHORS_CONSTANT_BOUND"

    - name: "accepts_nested_attributes_for reflection lost to a parallel gem bump"
      kind: "breaking"
      pattern: "accepts_nested_attributes_for\\b"
      exclude: ""
      search_paths:
        - "app/models/"
        - "lib/"
      explanation: "`accepts_nested_attributes_for :foo` raises `ArgumentError: No association found for name \\`foo'. Has it been defined yet?` at model class-load whenever `:foo` has no association reflection. This raise is not new in Rails 4.0 — it fires on any Rails version when the reflection is absent at class-load, so a genuinely-missing association is not a 3.2 → 4.0 regression (it would already have failed boot on 3.2). The way it surfaces as a NEW, next-side-only boot failure during a dual-boot hop: the reflection is provided by INHERITANCE from a gem-supplied base class, and a parallel gem bump in Gemfile.next silently removes it. Example: paper_trail 2.x defines a top-level `Version` carrying `belongs_to :item`; 3.x namespaces it to `PaperTrail::Version` and drops the top-level constant, so app models declared `< Version` that call `accepts_nested_attributes_for :item` lose the inherited reflection on the next side only. Operator filter — the primary regex matches ALL `accepts_nested_attributes_for` calls; a match is breaking ONLY when (a) the association is inherited from a gem-provided base class AND (b) that gem is being version-bumped in Gemfile.next. A same-file declared association is safe"
      fix: "Restore the lost reflection on the next side; leave the current side untouched. Two ways. (1) ROOT-CAUSE, preferred when a gem namespace / inheritance move is the cause: re-point the inherited base class in ONE place under the gate, leaving every subclass and reference unchanged. For the paper_trail example: `if NextRails.next?\\n  Version = PaperTrail::Version\\nend` in config/initializers/paper_trail.rb. (2) PER-MODEL, when the loss is per-model rather than a shared base class: re-declare the association on each affected model under the gate — `belongs_to :foo, polymorphic: true if NextRails.next?` (or the matching has_one / has_many). Why gate it: declaring unconditionally adds a duplicate auto-generated reader+writer on the current side, where the reflection still arrives via inheritance. A hand-rolled `def foo` override is preserved either way — Ruby resolves the explicit method before the generated reader. After cutover, drop the `NextRails.next?` gate"
      variable_name: "ACCEPTS_NESTED_NO_REFLECTION"

    - name: "Duplicate root route declarations across constraints"
      kind: "breaking"
      pattern: "^\\s*root\\s+(to:|=>|['\"])"
      exclude: ""
      search_paths:
        - "config/"
      explanation: "Only actionable when the routes file has 2+ `root` declarations (typically one per constraint block); a single root is fine, so treat a lone hit as noise. Rails 4 raises `ArgumentError: Invalid route name, already in use: 'root'` on the second and later `root` declarations. Rails 3.2 was lenient about duplicate names with different constraints. Matches all three forms: `root to:`, `root =>`, and the Rails 4 string shorthand `root \"home#index\"`"
      fix: "Keep the FIRST `root` declaration as the default `:root` name; add `as: :<unique_name>` to the SECOND and subsequent declarations. Renaming all of them (giving the first an `as:` too) silently breaks every `root_path` / `root_url` call site because the `:root` name is no longer registered. Real apps have dozens to hundreds of these helper calls. Verification step: `grep -rnE \"\\b(root_path|root_url)\\b\" app/ config/ lib/` and confirm no caller targets a constraint-bound root that was renamed"
      variable_name: "DUPLICATE_ROOT_ROUTES"

    - name: "Hyphenated or CamelCase controller name in routes to: value"
      kind: "breaking"
      pattern: "\\bto:\\s*['\"][^'\"]*(-|[A-Z])[^'\"]*#"
      exclude: "^\\s*#"
      search_paths:
        - "config/"
      explanation: "Rails 4 validates controller names in `to:` clauses with strict rules: no hyphens, no CamelCase. Hyphenated values raise `ArgumentError: 'foo-bar' is not a supported controller name`; the CamelCase form raises the same error. Rails 3.2 was lenient. URL paths (the route path itself) can keep hyphens — only the controller class reference in `to:` needs to be snake_case. Detects both single- and double-quoted `to:` values; a hyphen in the URL path (before `to:`) does not trigger it. Unlike the root/module patterns this one is not line-anchored (a `to:` value sits mid-line), so the `exclude` skips whole-line comments (`^\\s*#`) to avoid flagging commented-out routes; a trailing comment on a live route line still flags"
      fix: "Replace hyphens with underscores and CamelCase with snake_case in `to:` values. URL paths keep their original form. The snake_case form resolves to the same controller class on Rails 3.2, so the rewrite ships pre-bump and is backwards-compatible. Example: `to: \"my-pages#show\"` → `to: \"my_pages#show\"`; `to: \"MyPages#show\"` → `to: \"my_pages#show\"`"
      variable_name: "ROUTES_CONTROLLER_NAMES"

    - name: "Top-level module defined in a route file (autoload-on-reload boundary)"
      kind: "breaking"
      pattern: "^\\s*module\\s+[A-Z]\\w*"
      exclude: ""
      search_paths:
        - "config/routes/"
      explanation: "Rails 4's route loader does not reliably persist top-level module definitions across the routes-reload boundary. A pattern like `module Constraints; class Admin; ...; end; end` defined inside a `config/routes/*.rb` file may evaluate at boot but the `Constraints` constant does not survive subsequent reloads — downstream uses (e.g. `constraints Constraints::Admin do ... end`) raise `NameError: uninitialized constant Constraints`. Rails 3.2 was more lenient — modules defined in route files persisted across reload boundaries. Matches module definitions including the compact-nested `module Constraints::Admin` form; option lines like `scope module: \"admin\"` are not definitions and do not match"
      fix: "Extract the inline module out of the route file into a conventional autoload path so the constant is loaded the same way on both Rails versions. This fix is version-agnostic — no `NextRails.next?` branch is needed, because an autoloaded constant survives the routes-reload boundary on 4.0 and loads identically on 3.2. Steps: (1) Move the definition into an autoload location that mirrors the constant name, e.g. `Constraints::Admin` → `app/constraints/constraints/admin.rb`. Every directory under `app/` is on the autoload path by default on both 3.2 and 4.0, so no config change is needed; only if you place the file under `lib/` do you add `config.autoload_paths += [Rails.root.join(\"lib\")]` in `config/application.rb`. (2) Delete the `module ... end` wrapper from the route file, leaving only the usage. BEFORE (config/routes/admin.rb): `module Constraints; class Admin; def matches?(req); ...; end; end; end` followed by the `Rails.application.routes.draw` block that calls `constraints Constraints::Admin.new do ... end`. AFTER: the `module`/`class` block lives in `app/constraints/constraints/admin.rb`; the route file keeps only the `constraints Constraints::Admin.new do ... end` usage and no longer defines the constant"
      variable_name: "ROUTES_TOP_LEVEL_MODULE_AUTOLOAD"

  medium_priority:
    - name: "rescue_action method"
      kind: "breaking"
      pattern: "def rescue_action"
      exclude: ""
      search_paths:
        - "app/controllers/"
        - "lib/"
      explanation: "rescue_action was removed in Rails 4.0 with no deprecation warning"
      fix: "Replace with rescue_from ExceptionClass do |e| ... end"
      variable_name: "RESCUE_ACTION"

    - name: "ActiveRecord Observers"
      kind: "breaking"
      pattern: "ActiveRecord::Observer|observer.*:.*\\w+_observer|config\\.active_record\\.observers"
      exclude: ""
      search_paths:
        - "app/"
        - "config/"
      explanation: "ActiveRecord Observers were extracted from Rails 4.0"
      fix: "Add gem 'rails-observers' to Gemfile"
      variable_name: "OBSERVERS"

    - name: "ActionController Sweepers"
      kind: "breaking"
      pattern: "cache_sweeper|ActionController::Caching::Sweeper|< ActionController::Caching::Sweeper"
      exclude: ""
      search_paths:
        - "app/"
      explanation: "Sweepers were extracted from Rails 4.0"
      fix: "Add gem 'rails-observers' to Gemfile (includes sweepers)"
      variable_name: "SWEEPERS"

    - name: "Action caching (caches_page/caches_action)"
      kind: "breaking"
      pattern: "caches_page|caches_action"
      exclude: ""
      search_paths:
        - "app/controllers/"
      explanation: "Page and action caching were extracted from Rails 4.0 into two separate gems: caches_page moved to actionpack-page_caching, caches_action moved to actionpack-action_caching"
      fix: "Add gem 'actionpack-page_caching' for caches_page and/or gem 'actionpack-action_caching' for caches_action, matching the methods the app actually uses"
      variable_name: "ACTION_CACHING"

    - name: "ActiveResource usage"
      kind: "breaking"
      pattern: "ActiveResource|< ActiveResource::Base"
      exclude: ""
      search_paths:
        - "app/"
        - "lib/"
      explanation: "ActiveResource was extracted from Rails 4.0"
      fix: "Add gem 'activeresource' to Gemfile"
      variable_name: "ACTIVE_RESOURCE"

    - name: "vendor/plugins directory"
      kind: "breaking"
      pattern: ""
      exclude: ""
      search_paths:
        - "vendor/plugins/"
      explanation: "Rails 4.0 dropped support for vendor/plugins"
      fix: "Move plugin code to lib/ or convert to a gem"
      variable_name: "VENDOR_PLUGINS"

    - name: "cache_timestamp_format or external cache_key storage"
      kind: "breaking"
      pattern: "cache_timestamp_format|cache_key"
      exclude: ""
      search_paths:
        - "app/models/"
        - "config/"
      explanation: "Rails 4.0 changed cache_timestamp_format from :number to :nsec — stored cache keys may no longer match"
      fix: "Invalidate stored cache keys after upgrading, or set self.cache_timestamp_format = :number to preserve old format"
      variable_name: "CACHE_KEY_FORMAT"

    - name: "ActiveSupport::BufferedLogger"
      kind: "deprecation"
      pattern: "ActiveSupport::BufferedLogger"
      exclude: ""
      search_paths:
        - "app/"
        - "lib/"
        - "config/"
      explanation: "ActiveSupport::BufferedLogger was renamed to ActiveSupport::Logger in Rails 4.0"
      fix: "Replace ActiveSupport::BufferedLogger with ActiveSupport::Logger"
      variable_name: "BUFFERED_LOGGER"

    - name: "config.assets.compress"
      kind: "breaking"
      pattern: "config\\.assets\\.compress"
      exclude: ""
      search_paths:
        - "config/environments/"
      explanation: "config.assets.compress was removed in Rails 4.0"
      fix: "Replace with config.assets.js_compressor = :uglifier and config.assets.css_compressor = :sass"
      variable_name: "ASSETS_COMPRESS"

    - name: "config.paths[\"config/routes\"] (without .rb)"
      kind: "breaking"
      pattern: "config\\.paths\\[.config/routes.\\]"
      exclude: "routes.rb"
      search_paths:
        - "config/"
        - "lib/"
      explanation: "Rails 4.0 changed the config-paths key from 'config/routes' to 'config/routes.rb'. On Rails 3.2 only the un-suffixed key is populated; renaming pre-bump returns nil for the old key and the next chained call raises NoMethodError: undefined method `concat' for nil:NilClass at boot. The claim that Rails 3.2.13+ silently accepts either form is false — only Rails 4+ accepts the .rb-suffixed key"
      fix: "Do NOT rename in place pre-bump — that breaks Rails 3.2 boot. Branch with NextRails.next?: `key = NextRails.next? ? \"config/routes.rb\" : \"config/routes\"; config.paths[key].concat(...)` (or duplicate the block inside `if NextRails.next? ... else ... end`). Once the app is fully on Rails 4+, drop the branch"
      variable_name: "CONFIG_ROUTES_PATH"

    - name: "assign_attributes with options hash"
      kind: "breaking"
      pattern: "assign_attributes\\(.*,\\s*\\w+:"
      exclude: ""
      search_paths:
        - "app/"
        - "lib/"
      explanation: "Rails 4.0 removed the options argument from assign_attributes. On Rails 3.2, assign_attributes(attrs, as: :admin) (or without_protection: true) invokes role-based mass-assignment tied to attr_accessible :foo, as: :admin. Dropping the options hash pre-bump silently changes mass-assignment scope on remaining 3.2 deploys and may permit attribute writes that the role-scoped attr_accessible declaration would otherwise filter — a silent security regression"
      fix: "Do NOT bulk-drop the second arg pre-bump. Two safe paths: (1) branch the call with NextRails.next? — `if NextRails.next? then obj.assign_attributes(attrs) else obj.assign_attributes(attrs, as: :admin) end`; or (2) keep the option-hash form and rely on the protected_attributes bridge gem on the next side, which preserves role-scoped attr_accessible on Rails 4+. Pick (1) when the role scope is genuinely unused; pick (2) when role-based mass assignment is load-bearing"
      variable_name: "ASSIGN_ATTRIBUTES_OPTIONS"

    - name: "_run_validation_callbacks"
      kind: "breaking"
      pattern: "_run_validation_callbacks"
      exclude: ""
      search_paths:
        - "app/"
        - "lib/"
      explanation: "Internal method _run_validation_callbacks was removed in Rails 4.0 with no deprecation warning"
      fix: "Replace with run_callbacks(:validation) — the public API exists on Rails 3.2 (via ActiveModel::Validations::Callbacks / ActiveSupport::Callbacks) and 4.0+, so the swap is backwards-compatible. Real-world incidence is low — typically only ActiveModel form objects and edge-case validators hit this internal API"
      variable_name: "RUN_VALIDATION_CALLBACKS"

    - name: "select('distinct ...').pluck"
      kind: "migration"
      pattern: "select\\(.*distinct.*\\)\\.pluck"
      exclude: ""
      search_paths:
        - "app/"
        - "lib/"
      explanation: "Rails 4.0 introduced .distinct as the preferred way to get distinct results"
      fix: "Replace .select('distinct column').pluck(:column) with .distinct.pluck(:column)"
      variable_name: "SELECT_DISTINCT_PLUCK"

    - name: "ActiveRecord::ImmutableRelation risk"
      kind: "breaking"
      pattern: "\\.count\\(['\"]distinct"
      exclude: ""
      search_paths:
        - "app/"
        - "lib/"
      explanation: "Rails 4.0 raises ActiveRecord::ImmutableRelation when calling count with a string on a loaded/modified relation"
      fix: "Replace .count('distinct column') with .distinct.count"
      variable_name: "IMMUTABLE_RELATION"

    - name: "Fixture dynamic dates without string cast"
      kind: "breaking"
      pattern: "<%=.*\\.(ago|from_now|since|until).*%>"
      exclude: "to_s"
      search_paths:
        - "spec/fixtures/"
        - "test/fixtures/"
      explanation: "Rails 4.0 is stricter about date parsing in YAML fixtures"
      fix: "Cast dynamic dates to strings: <%= 3.days.ago.to_s(:db) %>"
      variable_name: "FIXTURE_DATES"

    - name: "Association :conditions option passed a proc"
      kind: "deprecation"
      pattern: "(has_many|has_one|belongs_to|has_and_belongs_to_many).*:?conditions.*?(\\bproc\\s*\\{|Proc\\.new\\s*(do|\\{))"
      exclude: ""
      search_paths:
        - "app/models/"
      explanation: "At the 3.2 → 4.0 hop this keeps working, with a deprecation warning, because activerecord-deprecated_finders is a default dependency of Rails 4.0 (removed in 4.1). That gem restores the `:conditions` option and instance_evals a proc value against the owner, so the Rails 3.2 receiver semantics are preserved on 4.0. The hazard is the eventual rewrite, not the bump: the native Rails 4 replacement is a scope lambda that is instance_exec'd against the relation (`klass.unscoped`) with the owner passed as the lambda argument, so `self` is the relation, not the owner. A careless rewrite to a bare `-> { where(x: x) }` resolves `x` against the relation instead of the owner — a silent shift"
      fix: "Two options. (1) Defer: rely on the bundled activerecord-deprecated_finders through the 4.0 window; the proc keeps working and only warns. (2) Rewrite for forward compatibility (required before dropping the gem or moving to 4.1): convert to a scope lambda whose parameter is the owner. Example: `belongs_to :foo, conditions: proc { where(clinic_id: clinic_id) }` becomes `belongs_to :foo, ->(owner) { where(clinic_id: owner.clinic_id) }`. Bare attribute references and `self.x` that targeted the owner become `owner.x`; local variables and constants stay as-is. The lambda form works on Rails 3.2 and 4.0+, so the rewrite is backwards-compatible"
      variable_name: "ASSOCIATION_CONDITIONS_PROC"

    - name: "order(column: :value) with a non-direction value"
      kind: "breaking"
      pattern: "order\\(\\s*:?\\w+\\s*(:|=>)\\s*:\\w+"
      exclude: ":asc|:desc"
      search_paths:
        - "app/models/"
      explanation: "Rails 4.0 added the `order(column: :direction)` hash syntax together with strict validation: `validate_order_args` raises `ArgumentError: Direction should be :asc or :desc` for any hash value other than `:asc` / `:desc`. Plain ActiveRecord 3.2 had no hash-order syntax, so a pre-existing `order(event: :start)` on 3.2 came from an extension like Squeel (which read the hash as joined_table => column). On Rails 4 that same call raises regardless of whether Squeel is loaded. The exclude regex filters legitimate direction hashes (`order(name: :asc)`, `order(id: :desc)`)"
      fix: "Branch to literal SQL on the next side: `if NextRails.next?; relation.order(\"events.start ASC\"); else; relation.order(event: :start); end` (or duplicate the chain inside an `if NextRails.next?` block). The choice of which join table to name in the SQL depends on the receiver chain — operator judgment per site. Forward-compat note for Rails 5.2+: bare-string `.order(\"events.start ASC\")` triggers a `Dangerous query method` warning; wrap with `Arel.sql(...)` (`Arel.sql(\"events.start ASC\")`) for forward compatibility. `Arel.sql` exists since Rails 3.0, so the wrap is backwards-compatible"
      variable_name: "SQUEEL_ORDER_JOINED_TABLE"

    - name: "has_many / has_one / belongs_to with string association name"
      kind: "breaking"
      pattern: "(has_many|has_one|belongs_to|has_and_belongs_to_many)\\s+\"[^\"]+\""
      exclude: ""
      search_paths:
        - "app/models/"
      explanation: "Rails 4 raises `ArgumentError: association names must be a Symbol` when the first argument to has_many / has_one / belongs_to / HABTM is a string. Rails 3.2 accepts a string and uses it as-is (String and Symbol are interchangeable in the underlying define_method); Rails 4 added a strict Symbol type check. Note: the primary regex matches only a literal `\"...\"` first argument. Method-chain shapes like `has_many type.tableize, dependent: :destroy` (inside a `types.each` loop) also raise the same error at class-load but the chain result is invisible to grep — a broader regex would generate too many false positives from options-keyword method calls. Recovery for method-chain shapes is via boot smoke: Rails 4's error ships with a stack trace pointing at the offending has_* line; append `.to_sym` to the computed expression"
      fix: "Convert string association names to symbols. For dynamic names (e.g. `has_many \"name_#{x}\"`), add `.to_sym` at the end of the expression. Symbols work on Rails 3.2 identically, so the rewrite ships pre-bump and is backwards-compatible"
      variable_name: "ASSOC_NAME_STRING"

    - name: "update_all with hash/string/array conditions (two-arg form)"
      kind: "deprecation"
      pattern: "update_all\\([^)]*,\\s*[\\{\"'\\[]"
      exclude: ""
      search_paths:
        - "app/"
        - "lib/"
        - "spec/"
        - "test/"
      explanation: "Class.update_all(set, conditions) two-arg form is deprecated in Rails 4.0 and removed in 4.1. The new form is Class.where(conditions).update_all(set). Covers hash, string, and array condition shapes. Note: activerecord-deprecated_finders does NOT bridge update_all — the bundled gem covers find(:first/:all/:last) and dynamic finders only, so this form must be rewritten before reaching Rails 4.1"
      fix: "Lift the second arg into a where chain. Hash: Class.update_all(set, {col: v}) → Class.where(col: v).update_all(set). Array: Class.update_all(set, [\"x = ?\", v]) → Class.where(\"x = ?\", v).update_all(set). String: Class.update_all(set, \"x = 1\") → Class.where(\"x = 1\").update_all(set). Both forms work on Rails 3.2 so the rewrite is backwards-compatible. False-positive watch: single-arg update_all on a relation that already has a where chain is the modern form (no comma + brace/quote/bracket — should not match the regex); rare update_all(strings.join(\",\")) shapes can trigger on the inner comma-quote — verify the second token is an actual conditions arg"
      variable_name: "UPDATE_ALL_TWO_ARG"

    - name: "Old-style finder (find(:first|:all|:last, conditions:))"
      kind: "deprecation"
      pattern: "find\\(\\s*:(first|all|last)"
      exclude: ""
      search_paths:
        - "app/"
        - "lib/"
        - "spec/"
        - "test/"
      explanation: "find(:first/:all/:last, conditions: ..., order: ..., ...) is the legacy ARel-1.0-style finder. Deprecated in Rails 3.2 (still works), removed in Rails 4.1. On Rails 4.0 it continues to work because activerecord-deprecated_finders ships as a default dependency — the gem is removed at 4.1, at which point the form must be rewritten"
      fix: "Two valid paths. (1) Defer: leave the calls in place for the 3.2 → 4.0 hop and rely on the bundled activerecord-deprecated_finders gem; rewrite at the 4.0 → 4.1 hop. (2) Pre-bump cleanup: lift each hash key into a chained relation method. Class.find(:first, conditions: c) → Class.where(c).first; Class.find(:first, conditions: c, order: o) → Class.where(c).order(o).first; Class.find(:all, conditions: c) → Class.where(c); Class.find(:last, conditions: c) → Class.where(c).last. All recipes work on Rails 3.2 and 4.0+ natively. Important semantic shift for the :all form: find(:all, ...) returned an Array; where(...) returns an ActiveRecord::Relation. Most call sites just iterate, so the bare where(c) rewrite is fine; add .to_a only when downstream uses Array-specific methods. False-positive watch: Enumerable#find(ifnone) accepts a positional argument as the default if no block matches, so array.find(:all) / hash.find(:first) etc. would technically match — verify the receiver is an ActiveRecord class or relation (not a plain Array/Hash/Range). Also watch for Capybara page.find(..., match: :first) — different API, leave alone"
      variable_name: "OLD_FINDER"

    - name: "Class.scoped (deprecated, returns base relation)"
      kind: "deprecation"
      pattern: "\\bscoped\\b"
      exclude: ""
      search_paths:
        - "app/"
        - "lib/"
        - "spec/"
        - "test/"
      explanation: "Two related Rails-3-only deprecations share the `.scoped` name: bare `Model.scoped` (returns base Relation, replaced by `Model.all`/`where(nil)`) and `Model.scoped(conditions: ..., include: ..., order: ...)` (the with-args ad-hoc scope constructor, replaced by chained relation methods). Both deprecated in Rails 4.0, removed in 4.1. On Rails 4.0 the bundled activerecord-deprecated_finders gem keeps both forms working — rewrite is mandatory before the 4.0 → 4.1 hop. The pattern matches `scoped` as a whole word so it also catches the bare in-model form (implicit `self`, e.g. `scope :foo, -> { scoped.where(...) }`), not just `Receiver.scoped`; the `\\b` boundaries already exclude look-alikes such as `unscoped`, `default_scoped`, `scoped_ids`, `reset_scope`, and `def x_scoped`, so no exclude regex is needed"
      fix: "Form A — bare `Model.scoped` (no args). Pick per call-site by looking at what comes after. A1 (terminal, no further chaining): `Model.scoped` → `Model.all`. On Rails 3.2 `.all` materializes to an Array; on 4.0+ it returns a Relation. Iteration via `.each`/`.map` works on both. A2 (chained, followed by `.joins`/`.where`/`.merge`): `Model.scoped` → `Model.where(nil)`. `where(nil)` returns a Relation with no conditions on both 3.2 and 4.0+, preserving chaining. Example: `scope :foo, -> { scoped.joins(:bar) }` → `scope :foo, -> { where(nil).joins(:bar) }`. Form B — `Model.scoped(hash)`. Break the hash into chained methods: `conditions:` → `.where`, `include:` → `.includes`, `order:` → `.order`, `joins:` → `.joins`, `select:` → `.select`, `limit:` → `.limit`, `offset:` → `.offset`, `group:` → `.group`, `having:` → `.having`, `readonly: true` → `.readonly(true)`. All chains work on Rails 3.2 and 4.0+. False-positive watch: a local variable, symbol, or string literally named `scoped` (rare) — `\\b` boundaries already rule out `unscoped` / `default_scoped` / `scoped_ids` / `x_scoped`, so the residual noise is only a bare `scoped` token that is not the AR method"
      variable_name: "CLASS_SCOPED"

  low_priority:
    - name: "request.env.merge! in tests"
      kind: "optional"
      pattern: "request\\.env\\.merge!"
      exclude: ""
      search_paths:
        - "spec/"
        - "test/"
      explanation: "Rails 4.0 added request.headers.merge! as the preferred test request-header API, but request.env.merge! continues to work in legacy ActionController::TestCase-style controller specs on every supported Rails version. The real forcing function is the Rails 5+ migration from ActionController::TestCase to ActionDispatch::IntegrationTest (the former was extracted to the rails-controller-testing gem in 5.1, still maintained). For a 3.2 → 4.0 hop, this is opt-in cleanup, not a required fix — no specific Rails version removes request.env.merge! outright"
      fix: "Skippable for the 3.2 → 4.0 hop — request.env.merge! still works on Rails 4+. If opting in: on Rails 4+ it is a 1:1 substitution, request.env.merge!(headers) → request.headers.merge!(headers). Trap on Rails 3.2: ActionDispatch::Http::Headers#merge! exists but the Rack-key normalization layer Rails 4 added is absent, so Rack-env-style keys (HTTP_AUTHORIZATION, HTTP_*) silently fail to reach the controller — a real hop saw ~65% of auth-heavy controller examples fail because the auth header stopped propagating on 3.2. If rewriting during the dual-boot window, defer to the Rails 4+ side; do not bulk-rewrite pre-bump"
      variable_name: "REQUEST_ENV_MERGE"

dependencies:
  protected_attributes:
    check: false
    gem_name: "protected_attributes"
    message: "Temporary bridge gem for attr_accessible — migrate to Strong Parameters then remove"
    url: "https://github.com/rails/protected_attributes"

  rails_observers:
    check: false
    gem_name: "rails-observers"
    message: "Required if using ActiveRecord Observers or Sweepers"
    url: "https://github.com/rails/rails-observers"

  activerecord_deprecated_finders:
    check: false
    gem_name: "activerecord-deprecated_finders"
    message: "Default dependency of Rails 4.0 (removed in 4.1), so these keep working with a deprecation warning on 4.0. Restores dynamic finders (find_all_by_* etc.) and old-style association options (:conditions including a proc, :order, :include, :uniq, :readonly — not :extend). Temporary bridge: migrate off then drop the gem before 4.1"
    url: "https://github.com/rails/activerecord-deprecated_finders"

  actionpack_action_caching:
    check: false
    gem_name: "actionpack-action_caching"
    message: "Required if using caches_action — extracted from Rails core at 4.0"
