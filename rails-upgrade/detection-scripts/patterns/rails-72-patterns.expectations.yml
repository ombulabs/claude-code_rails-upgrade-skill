# Fixture expectations for rails-72-patterns.yml.
#
# Keyed by variable_name (matching the entries in rails-72-patterns.yml). For
# each pattern you cover, list:
#   match     - lines the pattern MUST flag (the real breaking-change shapes)
#   no_match  - lines it MUST NOT flag (safe code + known false-positive traps)
#
# A line is "flagged" when the entry's `pattern` regex matches it AND the
# entry's `exclude` regex (when present) does not: a per-line grep + grep -v.
#
# Run with:
#   bin/test-patterns rails-upgrade/detection-scripts/patterns/rails-72-patterns.yml

RUBY_VERSION:
  # Rails 7.2 requires Ruby >= 3.1.0. Lines come from the Gemfile,
  # .ruby-version and .tool-versions.
  match:
    - "ruby \"3.0.6\""
    - "ruby \"~> 3.0.6\""
    - "ruby '~> 2.7'"
    - "ruby \"= 3.0.6\""
    - "ruby \"2.7.8\""
    - "3.0.6"
    - "ruby-3.0.6"
    - "ruby 3.0.6"
  no_match:
    - "ruby \"3.1.4\""
    - "3.3.6"
    - "ruby 3.3.0"
    - "ruby \">= 3.1\""
    # requirements that still allow 3.1+: Bundler checks the running Ruby
    - "ruby \"~> 3.0\""
    - "ruby \">= 2.7.0\""
    - "ruby \"~> 3.1.4\""
    - "3.10.0"
    - "ruby file: \".ruby-version\""
    - "gem \"rack\", \"3.0.8\""
    - "nodejs 20.1.0"
