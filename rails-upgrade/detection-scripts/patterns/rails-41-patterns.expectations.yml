# Fixture expectations for rails-41-patterns.yml.
#
# Keyed by variable_name (matching the entries in rails-41-patterns.yml). For
# each pattern you cover, list:
#   match     - lines the pattern MUST flag (the real breaking-change shapes)
#   no_match  - lines it MUST NOT flag (safe code + known false-positive traps)
#
# A line is "flagged" when the entry's `pattern` regex matches it AND the
# entry's `exclude` regex (when present) does not — a per-line grep + grep -v.
#
# Run with:
#   bin/test-patterns rails-upgrade/detection-scripts/patterns/rails-41-patterns.yml

CACHE_DIGESTS_BACKPORT:
  match:
    - "gem 'cache_digests'"
    - "  gem \"cache_digests\", \"~> 0.3.1\""
    - "    CacheDigests::TemplateDigestor.digest(name, :html, lookup_context)"
    - "  CacheDigests.cache = ActiveSupport::Cache::MemoryStore.new"
  no_match:
    - "gem 'cache_digest'"
    - "# gem 'cache_digests'"
    - "gem 'cache_digests' unless NextRails.next?"
    - "  ActionView::Digestor.digest(name: name, finder: lookup_context)"
    - "  config.action_view.cache_template_loading = true"
    - "  <% cache [@post, 'v3'] do %>"

ASSOCIATION_CONDITIONS:
  match:
    - "  has_many :active_items, class_name: \"Item\", conditions: { active: true }"
    - "  has_one :primary_address, :class_name => \"Address\", :conditions => \"primary = 1\""
    - "  belongs_to :author, class_name: \"User\", conditions: [\"deleted_at IS NULL\"]"
    - "  has_and_belongs_to_many :tags, conditions: { visible: true }"
    - "  has_many :items, conditions: proc { [\"account_id = ?\", account_id] }"
  no_match:
    - "  has_many :active_items, -> { where(active: true) }, class_name: \"Item\""
    - "  has_many :items, ->(owner) { where(account_id: owner.account_id) }"
    - "  has_many :items, before_add: :check_conditions"
    # not an association: the validator's own :conditions option is still valid at 4.1
    - "  validates_uniqueness_of :email, conditions: -> { where(deleted_at: nil) }"

ASSOCIATION_ORDER:
  match:
    - "  has_many :items, :order => 'position ASC'"
    - "  has_one :latest_comment, class_name: \"Comment\", order: \"created_at DESC\""
    - "  has_and_belongs_to_many :tags, order: :name"
  no_match:
    - "  has_many :items, -> { order('position ASC') }"
    - "  has_one :latest_comment, -> { order(created_at: :desc) }, class_name: \"Comment\""
    # underscore before "order" (sort_order) must not trip the [^_] guard
    - "  has_many :items, sort_order: 'asc'"
    # an association named order is not the option
    - "  belongs_to :order, touch: true"
    - "  has_many :orders, dependent: :destroy"

ASSOCIATION_UNIQ:
  match:
    - "  has_many :tags, through: :taggings, uniq: true"
    - "  has_and_belongs_to_many :roles, :uniq => true"
    - "  has_one :primary_tag, through: :primary_tagging, uniq: true"
  no_match:
    - "  has_many :tags, -> { distinct }, through: :taggings"
    - "  has_many :tags, -> { uniq }, through: :taggings"
    - "  has_many :unique_visits, dependent: :destroy"

ASSOCIATION_READONLY:
  match:
    - "  has_many :tags, through: :taggings, readonly: false"
    - "  has_many :line_items, :through => :orders, :readonly => true"
    - "  has_and_belongs_to_many :roles, readonly: true"
    - "  belongs_to :account, readonly: true"
    - "  has_one :profile, :readonly => true"
  no_match:
    - "  has_many :tags, -> { readonly }, through: :taggings"
    - "  has_many :tags, -> { readonly(false) }, through: :taggings"
    - "  has_many :tags, through: :taggings"

# The scanner matches file content, so a body on the next line
# (`scope :active,` then `where(...)` below it) is caught there; a fixture
# line can only show the single-line shapes.
SCOPE_WITHOUT_LAMBDA:
  match:
    - "  scope :active, where(active: true)"
    - "  scope :recent, order('created_at DESC')"
    - "  scope :with_author, joins(:author).where(authors: { active: true })"
    - "  scope :sorted, scoped.order(:name)"
    - "  scope :published, :conditions => { published: true }"
    - "  scope :visible, conditions: { hidden: false }"
  no_match:
    - "  scope :active, -> { where(active: true) }"
    - "  scope :active,->{ where(active: true) }"
    - "  scope :by_flag, ->(flag) { where(active: flag) }"
    - "  scope :active, lambda { where(active: true) }"
    - "  scope :active, proc { where(active: true) }"
    - "  scope :active, Proc.new { where(active: true) }"
    - "  scope :search, (proc { |q| where('name LIKE ?', q) })"
    - "  # scope :archived, where(archived: true)"
    - "  default_scope { where(deleted_at: nil) }"
    - "  def self.active; where(active: true); end"

# The scanner matches file content, so `default_scope(` with the lambda on
# the next line is still skipped there; a fixture line can only show the
# single-line shapes.
DEFAULT_SCOPE_WITHOUT_BLOCK:
  match:
    - "  default_scope where(deleted_at: nil)"
    - "  default_scope order('created_at DESC')"
    - "  default_scope(where(active: true))"
    - "  default_scope :order => 'name'"
    - "  default_scope order: 'name'"
    - "  default_scope includes(:author)"
  no_match:
    - "  default_scope { where(deleted_at: nil) }"
    - "  default_scope do"
    - "  default_scope -> { order(:name) }"
    - "  default_scope(-> { order(:name) })"
    - "  default_scope lambda { order(:name) }"
    - "  default_scope proc { order(:name) }"
    - "  default_scope Proc.new { order(:name) }"
    - "  def self.default_scope"
    - "  # default_scope where(deleted_at: nil)"
    - "  # Joining :user applies the default_scope, so filter in SQL"
    - "  self.default_scopes = []"
    - "  Model.unscoped { build_default_scope }"

SCOPE_NAME_COLLISION:
  match:
    - "  scope :none, -> { where('1 = 0') }"
    - "  scope :all, -> { where(archived: false) }"
    - "  scope :first, -> { order(:id).limit(1) }"
    - "  scope :count, -> { select('COUNT(*)') }"
    - "  scope :new, -> { where(state: 'new') }"
    - "  scope :distinct, -> { select('DISTINCT name') }"
    - "    scope :where, lambda { |*args| super(*args) }"
  no_match:
    - "  scope :none_assigned, -> { where(assignee_id: nil) }"
    - "  scope :allowed, -> { where(allowed: true) }"
    - "  scope :newest, -> { order(created_at: :desc) }"
    - "  scope :active, -> { where(active: true) }"
    - "  scope :recent_first, -> { order(created_at: :desc) }"
    - "  Post.none"
    - "  # scope :none, -> { where('1 = 0') }"
    - "  def self.none; where('1 = 0'); end"
